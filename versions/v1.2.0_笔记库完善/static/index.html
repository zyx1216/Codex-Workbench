<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识消化平台</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"></div>

  <header class="topbar glass">
    <div class="brand gradient-text">📘 知识消化平台</div>
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-tab="home">首页</button>
      <button class="nav-btn" data-tab="notes">笔记库</button>
      <button class="nav-btn" data-tab="settings">设置</button>
    </nav>
  </header>

  <main class="main">
    <!-- 首页 -->
    <section class="tab active" data-tab="home">
      <h2 class="section-title gradient-text">概览</h2>
      <div class="cards stats">
        <div class="card glass stat">
          <div class="stat-label">笔记总数</div>
          <div class="stat-value counter" data-target="0">0</div>
        </div>
        <div class="card glass stat">
          <div class="stat-label">今日新增</div>
          <div class="stat-value counter" data-target="0">0</div>
        </div>
        <div class="card glass stat">
          <div class="stat-label">待处理</div>
          <div class="stat-value counter purple" data-target="0">0</div>
        </div>
      </div>

      <h2 class="section-title">最近笔记</h2>
      <div class="card glass empty" id="recent-notes">
        <div class="empty-icon">📭</div>
        <p>暂无笔记</p>
        <p class="hint">添加链接或上传文件后，这里会显示最近的 5 条</p>
      </div>

      <h2 class="section-title">快速操作</h2>
      <div class="cards actions">
        <button class="card glass action" data-action="add-link">
          <span class="action-icon">🔗</span>
          <span class="action-text">输入链接</span>
        </button>
        <button class="card glass action" data-action="upload">
          <span class="action-icon">📤</span>
          <span class="action-text">上传文件</span>
        </button>
      </div>
    </section>

    <!-- 笔记库 -->
    <section class="tab" data-tab="notes">
      <h2 class="section-title gradient-text">笔记库</h2>
      <div class="toolbar">
        <input type="text" id="notes-search" class="input" placeholder="🔍 搜索标题或内容…" />
        <select id="notes-tag-filter" class="input">
          <option value="">全部标签</option>
        </select>
        <select id="notes-category-filter" class="input">
          <option value="">全部分类</option>
        </select>
      </div>
      <div id="notes-list" class="notes-list"></div>
    </section>

    <!-- 设置 -->
    <section class="tab" data-tab="settings">
      <h2 class="section-title gradient-text">AI 配置</h2>
      <div class="card glass form-card">
        <label class="field">
          <span class="field-label">服务商</span>
          <select id="ai-provider" class="input">
            <option value="doubao">豆包（火山引擎）</option>
            <option value="custom">自定义（OpenAI 兼容）</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Base URL</span>
          <input type="text" id="ai-base-url" class="input"
                 placeholder="https://ark.cn-beijing.volces.com/api/v3" />
        </label>
        <label class="field">
          <span class="field-label">模型名称</span>
          <input type="text" id="ai-model" class="input" placeholder="doubao-pro-32k" />
        </label>
        <label class="field">
          <span class="field-label">API Key（已保存则不显示原文，留空表示不修改）</span>
          <input type="password" id="ai-api-key" class="input" placeholder="sk-..." />
        </label>
        <div class="btn-row">
          <button class="btn btn-primary" id="btn-save">保存配置</button>
          <button class="btn btn-ghost" id="btn-test">测试连接</button>
        </div>
      </div>

      <h2 class="section-title">数据管理</h2>
      <div class="card glass form-card">
        <div class="field">
          <span class="field-label">数据库路径</span>
          <code class="path" id="db-path">./data/database.db</code>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" data-action="export">导出数据</button>
          <button class="btn btn-ghost" data-action="import">导入数据</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 链接处理弹窗 -->
  <div class="modal-mask" id="link-modal" hidden>
    <div class="modal glass">
      <button class="modal-close" id="link-modal-close" title="关闭">×</button>

      <!-- 输入阶段 -->
      <div class="modal-stage" id="modal-stage-input">
        <h3 class="modal-title">🔗 输入网页链接</h3>
        <p class="modal-desc">粘贴文章网址，自动抓取正文并改写成小白笔记。</p>
        <input type="text" id="link-url-input" class="input"
               placeholder="https://example.com/article" />
        <div class="modal-error" id="link-modal-error" hidden></div>
        <div class="btn-row">
          <button class="btn btn-primary" id="btn-process-url">开始处理</button>
        </div>
      </div>

      <!-- 处理中阶段 -->
      <div class="modal-stage" id="modal-stage-loading" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">正在抓取和改写…</p>
        <p class="hint">抓取网页加 AI 改写大约需要十几秒，请稍候</p>
      </div>

      <!-- 预览阶段 -->
      <div class="modal-stage" id="modal-stage-preview" hidden>
        <h3 class="modal-title" id="preview-title"></h3>
        <div class="chip-row" id="preview-tags"></div>
        <div class="preview-content" id="preview-content"></div>
        <div class="btn-row">
          <button class="btn btn-primary" id="btn-save-note">💾 保存</button>
          <button class="btn btn-ghost" id="btn-regenerate">🔄 重新生成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 笔记编辑弹窗 -->
  <div class="modal-mask" id="edit-modal" hidden>
    <div class="modal glass">
      <button class="modal-close" id="edit-modal-close" title="关闭">×</button>
      <h3 class="modal-title">✏️ 编辑笔记</h3>

      <label class="field">
        <span class="field-label">标题</span>
        <input type="text" id="edit-title" class="input" />
      </label>
      <label class="field">
        <span class="field-label">正文</span>
        <textarea id="edit-content" class="input textarea" rows="14"></textarea>
      </label>
      <label class="field">
        <span class="field-label">标签（逗号分隔）</span>
        <input type="text" id="edit-tags" class="input" placeholder="标签1, 标签2" />
      </label>
      <label class="field">
        <span class="field-label">分类</span>
        <select id="edit-category" class="input"></select>
      </label>
      <div class="modal-error" id="edit-modal-error" hidden></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-save-edit">💾 保存</button>
        <button class="btn btn-ghost" id="btn-cancel-edit">取消</button>
      </div>
    </div>
  </div>

  <div id="toast-host"></div>

  <script src="/static/app.js"></script>
</body>
</html>
