<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识消化平台</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">📘 知识消化平台</h1>
      <nav class="nav" id="nav">
        <button class="nav-btn active" data-tab="home">首页</button>
        <button class="nav-btn" data-tab="notes">笔记库</button>
        <button class="nav-btn" data-tab="settings">设置</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <!-- 首页 -->
    <section class="tab active" data-tab="home">
      <h2 class="page-title">概览</h2>
      <div class="cards">
        <div class="card stat">
          <div class="stat-label">笔记总数</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="card stat">
          <div class="stat-label">今日新增</div>
          <div class="stat-value" id="stat-today">0</div>
        </div>
        <div class="card stat">
          <div class="stat-label">待处理</div>
          <div class="stat-value" id="stat-pending">0</div>
        </div>
      </div>

      <h2 class="page-title">最近笔记</h2>
      <div class="card empty" id="recent-notes">
        <p>暂无笔记</p>
        <p class="hint">在笔记库新建笔记后，这里会显示最近的 5 条</p>
      </div>

      <h2 class="page-title">快速操作</h2>
      <div class="cards">
        <button class="card action" data-action="add-link">🔗<br/>输入链接</button>
        <button class="card action" data-action="upload">📤<br/>上传文件</button>
      </div>
    </section>

    <!-- 笔记库 -->
    <section class="tab" data-tab="notes">
      <h2 class="page-title">笔记库</h2>
      <div class="toolbar">
        <input type="text" id="notes-search" class="input" placeholder="搜索标题或内容…" />
        <select id="notes-tag" class="input"><option value="">全部分类</option></select>
      </div>
      <div class="card empty" id="notes-list">
        <p>暂无笔记</p>
        <p class="hint">v1.1 将在这里显示笔记列表</p>
      </div>
    </section>

    <!-- 设置 -->
    <section class="tab" data-tab="settings">
      <h2 class="page-title">AI 配置</h2>
      <div class="card form-card">
        <label class="field">
          <span class="field-label">服务商</span>
          <select id="ai-provider" class="input">
            <option value="doubao">豆包（火山引擎）</option>
            <option value="custom">自定义（OpenAI 兼容）</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Base URL</span>
          <input type="text" id="ai-base-url" class="input" placeholder="https://ark.cn-beijing.volces.com/api/v3" />
        </label>
        <label class="field">
          <span class="field-label">模型名称</span>
          <input type="text" id="ai-model" class="input" placeholder="doubao-pro-32k" />
        </label>
        <label class="field">
          <span class="field-label">API Key（已保存则不显示原文）</span>
          <input type="password" id="ai-api-key" class="input" placeholder="留空表示不修改已保存的 Key" />
          <span class="field-status" id="ai-key-status">未保存</span>
        </label>
        <div class="btn-row">
          <button class="btn btn-primary" id="btn-save">保存配置</button>
          <button class="btn btn-secondary" id="btn-test">测试连接</button>
        </div>
      </div>

      <h2 class="page-title">数据管理</h2>
      <div class="card form-card">
        <div class="field">
          <span class="field-label">数据库路径</span>
          <code class="path" id="db-path"></code>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" data-action="export">导出数据</button>
          <button class="btn btn-secondary" data-action="import">导入数据</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-host"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
