<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f1f4fa; --border:#e2e8f2;
  --text:#1f2937; --text-2:#6b7280; --primary:#2563eb; --primary-hover:#1d4ed8;
  --primary-soft:#dbeafe; --danger:#dc2626; --danger-soft:#fee2e2;
  --green:#15803d; --green-soft:#dcfce7; --amber:#b45309; --amber-soft:#fef3c7;
  --gray:#475569; --gray-soft:#eef2f7;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 6px 16px rgba(16,24,40,.06);
  --radius:14px;
  --accent:#2563eb; --on-primary:#ffffff;
}
/* ===== 四季昼夜主题：data-season + data-time 覆盖变量 ===== */
[data-season="spring"][data-time="day"]{
  --bg:#f0f7e8; --surface:#ffffff; --surface-2:#e6f0d8; --border:#d2e0bf;
  --text:#22300f; --text-2:#4d5a3a;
  --primary:#4e7c2a; --primary-hover:#3c6120; --primary-soft:#ddeccb;
  --accent:#c2185b; --on-primary:#ffffff;
}
[data-season="spring"][data-time="night"]{
  --bg:#1a2a1f; --surface:#22352a; --surface-2:#2c4134; --border:#3a5142;
  --text:#e8f0e2; --text-2:#b3c4a8;
  --primary:#7cb342; --primary-hover:#9ccc65; --primary-soft:#33452a;
  --accent:#f48fb1; --on-primary:#16240c;
}
[data-season="summer"][data-time="day"]{
  --bg:#e3f2fd; --surface:#ffffff; --surface-2:#d3e7fa; --border:#c2d9ee;
  --text:#0d2233; --text-2:#3f5870;
  --primary:#0277bd; --primary-hover:#015a8c; --primary-soft:#c6e4fb;
  --accent:#2e7d32; --on-primary:#ffffff;
}
[data-season="summer"][data-time="night"]{
  --bg:#0d1f2d; --surface:#142c3f; --surface-2:#1c3a52; --border:#274b63;
  --text:#e6f1fb; --text-2:#a9c2d8;
  --primary:#29b6f6; --primary-hover:#5cc8ff; --primary-soft:#16384f;
  --accent:#66bb6a; --on-primary:#06182a;
}
[data-season="autumn"][data-time="day"]{
  --bg:#fff8e1; --surface:#ffffff; --surface-2:#fdf0d0; --border:#f0e0b0;
  --text:#33220a; --text-2:#6b5630;
  --primary:#c8430a; --primary-hover:#a83800; --primary-soft:#ffe4c4;
  --accent:#bf6b3b; --on-primary:#ffffff;
}
[data-season="autumn"][data-time="night"]{
  --bg:#2a1f10; --surface:#382a17; --surface-2:#473520; --border:#5a442a;
  --text:#f6ecdc; --text-2:#d3bd97;
  --primary:#ffb300; --primary-hover:#ffc94d; --primary-soft:#4d3a17;
  --accent:#d87b4a; --on-primary:#2a1a02;
}
[data-season="winter"][data-time="day"]{
  --bg:#eceff1; --surface:#ffffff; --surface-2:#dde3e7; --border:#cdd5db;
  --text:#1c2733; --text-2:#455564;
  --primary:#455a64; --primary-hover:#31444d; --primary-soft:#d3dce1;
  --accent:#8d6e63; --on-primary:#ffffff;
}
[data-season="winter"][data-time="night"]{
  --bg:#121a21; --surface:#1b2630; --surface-2:#25323d; --border:#33424f;
  --text:#e7edf3; --text-2:#a9b7c4;
  --primary:#78909c; --primary-hover:#9bb0bb; --primary-soft:#263540;
  --accent:#b08577; --on-primary:#0e161c;
}
/* 夜主题统一加深阴影 */
[data-time="night"]{ --shadow:0 1px 3px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.35); }
/* 主题切换仅过渡颜色，不过渡布局 */
body,.sidebar,.card,.modal,.toast,.plan-card,.plan-item,.note-item,.link-card,.cal-cell,.filter-bar,.cat-item,.fav,.tag,.mini-tag,.badge,.cat-badge,input,textarea,select,.md-preview,.fold-head,.tv-panel{
  transition:background-color .5s ease,border-color .5s ease,color .5s ease;
}
.brand-poem{font-size:11px;color:var(--text-2);padding:0 4px;margin-top:-6px;white-space:nowrap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--primary);text-decoration:none}

/* ============ 左侧侧边栏 ============ */
.sidebar{
  position:fixed;top:0;left:0;width:220px;height:100vh;
  display:flex;flex-direction:column;gap:14px;padding:18px 14px;
  background:var(--surface);border-right:1px solid var(--border);z-index:50;
}
.brand{font-weight:700;font-size:18px;white-space:nowrap;color:var(--primary);padding:0 4px}
.side-menu{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.tab{
  display:block;width:100%;text-align:left;
  border:none;background:transparent;padding:10px 14px;border-radius:10px;
  color:var(--text-2);white-space:nowrap;font-size:14px;
}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side-actions{display:flex;flex-direction:column;gap:8px}
.side-actions .icon-btn{width:100%;padding:9px 14px}
/* 分类筛选（侧边栏） */
.cat-area{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.cat-title{font-size:12px;color:var(--text-2);padding:0 4px;font-weight:600}
.cat-list{display:flex;flex-direction:column;gap:2px;max-height:190px;overflow-y:auto}
.cat-item{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;padding:7px 10px;border-radius:8px;color:var(--text-2);font-size:13px;text-align:left}
.cat-item:hover{background:var(--surface-2)}
.cat-item.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.cat-item .cat-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item .cat-count{font-size:11px;background:var(--surface-2);border-radius:10px;padding:0 7px;color:var(--text-2)}
.cat-item.on .cat-count{background:var(--surface);color:var(--primary)}
.cat-badge{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--text-2);background:var(--surface-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
/* 回收站弹窗列表 */
.trash-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--surface)}
.trash-row:hover{background:var(--surface-2)}
.trash-ico{font-size:16px}
.trash-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.trash-kind{font-size:11px;color:var(--text-2);background:var(--surface-2);border-radius:6px;padding:0 7px;white-space:nowrap}
.trash-time{font-size:11px;color:var(--text-2);white-space:nowrap}
.trash-acts{display:flex;gap:6px;white-space:nowrap}
.ne-cat{flex:1;min-width:120px;max-width:160px}
.nt-ai-tags{display:flex;flex-wrap:wrap;gap:8px}
.nt-ai-tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;color:var(--text)}
.nt-ai-tag button{border:none;background:transparent;color:var(--text-2);padding:0 5px;line-height:1.2;font-size:14px}
.nt-ai-tag button:hover{color:var(--danger)}
.nt-ai-add{display:flex;gap:8px;margin-top:8px}
.nt-ai-add input{flex:1}
.filter-bar{display:flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:13px}
.filter-bar[hidden]{display:none}
.filter-x{border:none;background:transparent;color:var(--primary);font-size:14px;cursor:pointer;line-height:1}
.icon-btn,.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:7px 14px;border-radius:10px;font-size:13px;transition:.15s;
}
.icon-btn:hover,.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary,#fff)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-ghost{background:transparent}
.btn-danger{color:var(--danger);border-color:var(--border);background:var(--surface)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
.btn-sm:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm.btn-danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.btn-sm.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}

main{margin-left:220px;padding:20px 24px}
.content{max-width:1400px;margin:0 auto}
.view{display:none}
.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=search],.toolbar input:not([type]),.toolbar>input{flex:1;min-width:160px}
input[type=text],input[type=search],input[type=date],input:not([type]),select,textarea{
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;outline:none;width:100%;
}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
input::placeholder,textarea::placeholder{color:var(--text-2);opacity:1}
textarea{resize:vertical;line-height:1.7}
.empty{color:var(--text-2);text-align:center;padding:28px 10px;font-size:13px}
.spacer{flex:1}

/* ============ 通用组件 ============ */
.badge{font-size:12px;padding:2px 10px;border-radius:999px;white-space:nowrap}
.st-0{background:var(--gray-soft);color:var(--gray)}
.st-1{background:var(--amber-soft);color:var(--amber)}
.st-2{background:var(--green-soft);color:var(--green)}
.prog{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#60a5fa);border-radius:99px;transition:width .3s}
.prog-num{font-size:12px;color:var(--text-2)}
.sub{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px 8px;padding:3px 0;font-size:13px}
.sub-label{display:flex;gap:8px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
.sub-link{border:none;background:transparent;font-size:13px;padding:2px 4px;opacity:0;transition:opacity .15s;flex-shrink:0;line-height:1.4}
.sub:hover .sub-link{opacity:1}
.sub-tags{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;padding-left:24px;margin-top:2px}
.note-chip{border:1px solid var(--border);background:var(--gray-soft);color:var(--text-2);font-size:11px;border-radius:6px;padding:1px 8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.note-chip:hover{border-color:var(--primary);color:var(--primary)}
.sub-label input{margin-top:4px;width:auto;flex-shrink:0}
.sub .done{text-decoration:line-through;color:var(--text-2)}
.row-actions{display:flex;gap:8px;margin-top:8px}

/* ============ 日历 ============ */
.cal-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.cal-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-header h3{flex:1;text-align:center;font-size:16px}
.cal-header button{min-width:34px}
.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-weekdays span{text-align:center;font-size:12px;color:var(--text-2);padding:4px 0;font-weight:600}
.cal-cell{
  min-height:74px;border:1px solid var(--border);border-radius:10px;padding:6px;
  background:var(--surface-2);display:flex;flex-direction:column;gap:4px;transition:.12s;
}
.cal-cell:not(.blank){cursor:pointer}
.cal-cell:not(.blank):hover{border-color:var(--primary)}
.cal-cell.blank{background:transparent;border-color:transparent}
.cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal-cell.selected{background:var(--primary-soft);border-color:var(--primary)}
.cal-num{font-size:13px;font-weight:600}
.cal-cell.today .cal-num{color:var(--primary)}
.cal-plan-list{display:flex;flex-direction:column;gap:2px;margin-top:auto;min-width:0}
.cal-plan,.cal-more{width:100%;min-width:0;border:0;background:transparent;padding:1px 2px;border-radius:4px;font:inherit;color:var(--text);text-align:left;display:flex;gap:3px;line-height:1.25;cursor:pointer}
.cal-plan:hover,.cal-more:hover{background:var(--primary-soft);color:var(--primary)}
.cal-plan-time{font-size:10px;color:var(--primary);font-weight:600;flex-shrink:0}
.cal-plan-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.cal-more{font-size:10px;color:var(--primary);font-weight:600}
.day-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.day-head h3{flex:1;font-size:15px}
.day-list{display:flex;flex-direction:column;gap:10px}
.plan-item{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-2)}
.plan-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.plan-title{font-weight:600;flex:1}
.day-card-head{cursor:pointer;user-select:none}
.day-card-head .fold-ico{margin-left:2px}
.day-card-body[hidden]{display:none}
.plan-item.day-card .plan-top{margin-bottom:6px}
.tl-section+.tl-section{margin-top:16px}
.tl-section-title{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 8px}
.tl-allday{display:flex;flex-direction:column;gap:10px}
.timeline{display:flex;flex-direction:column;gap:14px}
.tl-item{position:relative;display:grid;grid-template-columns:74px 1fr;gap:10px;padding-left:14px}
.tl-item::before{content:'';position:absolute;left:4px;top:10px;bottom:-14px;width:2px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-item::after{content:'';position:absolute;left:0;top:10px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--surface)}
.tl-time{border:0;background:transparent;padding:10px 0 0;font:inherit;color:var(--primary);font-weight:700;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.tl-time span{color:var(--text-2);font-weight:400}
.tl-body{min-width:0}

/* ============ 学习计划 ============ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
.stat .num{font-size:24px;font-weight:700;color:var(--primary)}
.stat .lbl{font-size:12px;color:var(--text-2)}
.plan-list{display:flex;flex-direction:column;gap:12px}
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer}
.plan-card:hover{border-color:var(--primary)}
.pc-head{display:flex;align-items:center;gap:10px}
.pc-title{font-weight:600;flex:1}
.pc-date{font-size:12px;color:var(--text-2)}
.pc-time{font-size:12px;color:var(--primary);font-weight:600;white-space:nowrap}
.tplan-time{font-size:12px;color:var(--primary);font-weight:700;white-space:nowrap;margin-right:4px}
.chev{color:var(--text-2);transition:.2s}
.plan-card.open .chev{transform:rotate(180deg)}
.pc-desc{color:var(--text-2);font-size:13px;margin:6px 0;white-space:pre-wrap}
.pc-body{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px}

/* ============ 笔记 ============ */
.notes-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.notes-side{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 130px)}
#noteList{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.note-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface-2)}
.note-item:hover{border-color:var(--primary)}
.note-item.on{border-color:var(--primary);background:var(--primary-soft)}
.ni-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-meta{font-size:11px;color:var(--text-2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.mini-tag{background:var(--gray-soft);border-radius:6px;padding:0 6px}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);margin:0 6px 6px 0;cursor:pointer;color:var(--text-2)}
.tag.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.notes-main{min-height:calc(100vh - 160px);display:flex;flex-direction:column;gap:10px}
.ne-head{display:flex;gap:10px;flex-wrap:wrap}
.ne-title{font-size:17px;font-weight:700;flex:2;min-width:180px}
.ne-tags{flex:1;min-width:140px}
.ne-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ne-spaced-next{font-size:12px;color:var(--text-2)}
.ne-body{flex:1;min-height:380px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.md-preview{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;overflow:auto}
.md-preview h1,.md-preview h2,.md-preview h3{margin:12px 0 6px}
.md-preview p{margin:6px 0}
.md-preview pre{background:var(--gray-soft);padding:10px;border-radius:8px;overflow:auto;margin:8px 0}
.md-preview code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.md-preview blockquote{border-left:3px solid var(--primary);padding-left:10px;color:var(--text-2);margin:8px 0}
.md-preview ul,.md-preview ol{padding-left:22px;margin:6px 0}
.md-preview table{border-collapse:collapse;margin:8px 0}
.md-preview th,.md-preview td{border:1px solid var(--border);padding:4px 10px}

/* ============ 链接 ============ */
.link-group{margin-bottom:18px}
.lg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lg-head h3{flex:1;font-size:15px}
.lg-acts{display:flex;gap:6px}
.link-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.link-card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);transition:.15s}
.link-card:hover{border-color:var(--primary);transform:translateY(-1px)}
.lc-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:var(--text)}
.fav{width:36px;height:36px;border-radius:9px;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary);font-weight:700}
.fav img{width:20px;height:20px;position:absolute;inset:0;margin:auto}
.lc-text{min-width:0}
.lc-name{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-note{font-size:12px;color:var(--text-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-acts{display:flex;gap:2px;opacity:.5;transition:.15s}
.link-card:hover .lc-acts{opacity:1}
.lc-acts button{border:none;background:transparent;font-size:14px;padding:2px 4px}

/* ============ 知识库 ============ */
.kb-layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.kb-side{max-height:calc(100vh - 130px);overflow-y:auto}
.kb-side-head{display:flex;align-items:center;margin-bottom:10px;font-weight:700}
.kb-side-head span{flex:1}
.kb-frow{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;font-size:13px}
.kb-frow:hover{background:var(--surface-2)}
.kb-fname{flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 4px;border-radius:6px}
.kb-fname.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.kb-facts{display:none;gap:2px}
.kb-frow:hover .kb-facts{display:flex}
.kb-facts button{border:none;background:transparent;font-size:12px;padding:2px 3px;color:var(--text-2)}
.kb-facts button:hover{color:var(--primary)}
.kb-main{min-height:calc(100vh - 160px)}
.kb-list{display:flex;flex-direction:column;gap:6px}
.kb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.kb-row:hover{border-color:var(--primary)}
.kb-rname{flex:1;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-ext{font-size:11px;background:var(--gray-soft);color:var(--text-2);border-radius:6px;padding:1px 8px}
.kb-time{font-size:12px;color:var(--text-2)}
.kb-acts{display:flex;gap:6px}
.kb-file-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.kf-name{font-weight:700;flex:1}
.kf-time{font-size:12px;color:var(--text-2)}
.kb-body{min-height:420px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.search-hit{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface-2);cursor:pointer}
.search-hit:hover{border-color:var(--primary)}
.search-hit .sh-path{font-size:11px;color:var(--text-2)}
.search-hit .sh-snip{font-size:12px;color:var(--text-2);margin-top:4px;white-space:pre-wrap;max-height:60px;overflow:hidden}
.kb-search-bar{gap:8px}
.kb-ai-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:13px}
.kb-ai-label{color:var(--text-2)}
.kb-ai-arrow{color:var(--text-2)}
.kb-ai-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:2px 8px;color:var(--text)}
.kb-ai-chip.origin{background:var(--primary-soft);color:var(--primary);border-color:transparent;font-weight:600}
.kb-ai-chip button{border:none;background:transparent;color:var(--text-2);padding:0 2px;line-height:1;cursor:pointer;font-size:14px}
.kb-ai-chip button:hover{color:var(--danger)}
mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}

/* ============ 弹窗 / 提示 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{flex:1;font-size:16px}
.modal-x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--text-2)}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--border)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--text-2)}
.time-range{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time-range input{width:auto;flex:0 1 130px}
.form .f-label{font-size:13px;color:var(--text-2)}
.f-sub-row{display:flex;gap:8px;margin-bottom:6px}
.confirm-msg{font-size:14px;line-height:1.8}
/* AI 设置弹窗 */
.ai-radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.ai-radio input{width:auto;margin-top:3px;flex-shrink:0}
.ai-radio span{display:flex;flex-direction:column;gap:2px}
.ai-radio small{color:var(--text-2);font-size:12px;font-weight:400}
.ai-keyrow{display:flex;gap:8px}
.ai-keyrow input{flex:1}
.ai-provider-note{margin:6px 0 0;color:var(--text-2);font-size:12px;line-height:1.5}
.ai-form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.ai-date-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai-keyrow .btn-sm{flex-shrink:0;min-height:36px}
.ai-testrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-test-result{font-size:12px;color:var(--text-2);min-width:0;word-break:break-all}
/* callAI 全局 loading 遮罩（z-index 高于弹窗 100、toast 200） */
.ai-loading{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:300;color:#fff}
.ai-spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:ai-spin .8s linear infinite}
.ai-loading-text{font-size:15px;font-weight:600;letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
@keyframes ai-spin{to{transform:rotate(360deg)}}
input[readonly]{opacity:.75}
#toastBox{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:9px 18px;box-shadow:var(--shadow);font-size:13px;opacity:0;transition:.25s}
.toast.show{opacity:1}
.toast.hide{opacity:0;transform:translateY(-8px)}
.toast.error{border-left-color:var(--danger)}

/* ============ 今日视图 ============ */
#view-today.active{display:flex;flex-direction:column;gap:14px}
.today-hero .today-date{font-size:20px;font-weight:700;color:var(--primary)}
.today-hero .today-sub{color:var(--text-2);font-size:13px;margin-top:4px}
.today-report{margin-top:10px}
.ai-report-preview{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;max-height:380px;overflow:auto}
.ai-report-range{display:flex;flex-direction:column;gap:8px}
.ai-report-range label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.ai-report-range input[type="radio"]{width:auto}
.ai-report-custom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.today-h{font-weight:700;font-size:15px;margin-bottom:10px}
.today-res{display:flex;flex-wrap:wrap;gap:8px}
.today-notes{display:flex;flex-direction:column;gap:8px}
.review-list{display:flex;flex-direction:column;gap:8px}
.review-note{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:var(--surface-2)}
.rv-main{min-width:0;flex:1}
.rv-title{border:none;background:transparent;padding:0;font-weight:600;color:var(--text);cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-title:hover{color:var(--primary)}
.rv-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:11px;color:var(--text-2)}
.review-level{background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:0 7px;font-weight:600}
.rv-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.fold-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:15px;user-select:none;margin-bottom:10px}
.fold-head:hover .fold-title{color:var(--primary)}
.fold-meta{flex:1;color:var(--text-2);font-size:12px;font-weight:400}
.fold-ico{color:var(--text-2);transition:transform .2s;transform:rotate(-90deg)}
.fold-ico.open{transform:rotate(0)}
.fold-body[hidden]{display:none}
/* 计划类型子导航与分组 */
.plan-type-nav{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
.ptn-item{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.ptn-item:hover{background:var(--surface-2)}
.ptn-item.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary);font-weight:600}
.plan-group{margin-bottom:14px}
/* 新建计划：类型选择弹窗 */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.type-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--text)}
.type-cell:hover{background:var(--primary-soft);border-color:var(--primary)}
.type-cell span{font-weight:600}
.type-cell em{font-style:normal;font-size:10px;color:var(--primary)}
.type-new{display:flex;gap:8px}
.type-new .tn-input{flex:1}
/* 计划级关联（不建子任务也能挂资料） */
.plan-refs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:6px 0;padding:5px 0;border-top:1px dashed var(--border)}
.pr-label{font-size:11px;color:var(--text-2)}
.plan-ref-btns{display:inline-flex;gap:4px}
.plan-link{opacity:1;font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
.plan-link:hover{background:var(--primary-soft);color:var(--primary)}
.plan-refs .sub-tags{flex-basis:100%;padding-left:0;margin-top:2px}
.batch-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--primary-soft);border:1px solid var(--primary);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.batch-bar .batch-count{color:var(--primary);font-weight:600;flex:1}
.batch-all{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:var(--primary)}
.batch-all input{width:auto;margin:0}
.batch-check{width:16px!important;height:16px!important;margin:0 6px 0 0;flex-shrink:0;cursor:pointer;accent-color:var(--primary)}
.plan-card.batch,.note-item[data-act="batchItem"],.kb-rname[data-act="batchItem"],.lc-main.batchable{cursor:pointer}
.lc-main.batchable{display:flex;align-items:flex-start;gap:10px;text-decoration:none;color:inherit}
.note-item[data-act="batchItem"] .ni-title{display:flex;align-items:center}
.res-group{margin-bottom:12px}
.res-group:last-child{margin-bottom:0}
.res-label{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.res-empty{padding:4px 10px;font-size:12px;text-align:left}
.tplan .pc-head{cursor:pointer}
.tv-panel{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tv-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.tv-title{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-body{max-height:52vh;overflow:auto;padding:12px}
.tv-doc{white-space:pre-wrap;word-break:break-word;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;color:var(--text);line-height:1.7}



/* ============ 响应式 ============ */
/* 平板（≤1024px）：侧边栏收窄、内边距收紧、网格降列 */
@media (max-width:1024px){
  .sidebar{width:200px;padding:16px 12px;gap:12px}
  main{margin-left:200px;padding:16px 18px}
  .content{max-width:100%}
  .kb-layout{grid-template-columns:220px 1fr}
  .link-cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .stats{gap:8px}
}
/* 触屏设备：原本仅 hover 显示的按钮常驻可见，并放大触控热区（≥40px） */
@media (hover:none){
  .sub-link{opacity:1;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .lc-acts{opacity:1}
  .kb-facts{display:flex}
  .tab{min-height:44px}
  .icon-btn{min-height:42px}
  .fold-head,.ptn-item,.cat-item{min-height:40px}
  .btn-sm{min-height:36px}
}
@media (max-width:768px){
  .sidebar{position:static;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px 12px;border-right:none;border-bottom:1px solid var(--border)}
  .brand{padding:0}
  .side-menu{flex:1 1 100%;order:3;flex-direction:row}
  .tab{width:auto;flex-shrink:0;text-align:center}
  .side-actions{flex-direction:row;margin-left:auto}
  .side-actions .icon-btn{width:auto;padding:7px 12px}
  main{margin-left:0;padding:12px}
  .cat-area{flex:1 1 100%;order:4;border-top:none;border-bottom:1px solid var(--border);padding:8px 0}
  .cat-list{flex-direction:row;max-height:none;overflow-x:auto}
  .cat-item{width:auto;flex-shrink:0}
  .cal-layout,.notes-layout,.kb-layout{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{padding:10px}
  .stat .num{font-size:18px}
  .cal-cell{min-height:72px}
  .notes-side,.kb-side{max-height:none}
  .ne-body{min-height:260px}
  /* 手机精修 */
  html,body{overflow-x:hidden}
  .side-menu{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .side-actions{width:100%;flex-wrap:wrap}
  .side-actions .icon-btn{flex:1;min-width:0;padding:8px 6px}
  .link-cards{grid-template-columns:1fr}
  .plan-type-nav{flex-wrap:nowrap;overflow-x:auto}
  .batch-bar{flex-wrap:nowrap;overflow-x:auto}
  .batch-bar>*{flex-shrink:0}
  .modal-mask{padding:0}
  .modal{max-width:100%;width:100%;max-height:100vh;height:100vh;border-radius:0}
  input,textarea,select{font-size:16px}
  .cal-cell{min-height:64px;padding:4px}
  .cal-num{font-size:12px}
  .cal-plan-time,.cal-plan-title,.cal-more{font-size:9px}
  .tl-item{grid-template-columns:58px 1fr;gap:8px;padding-left:12px}
  .row-actions{flex-wrap:wrap}
  .toolbar{gap:8px}
}

<body>

<aside class="sidebar">

  <div class="brand-poem" id="seasonPoem"></div>
  <nav class="side-menu">

</main>

<script>
'use strict';
/* ================= 基础工具 ================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
const todayStr = () => dstr(new Date());
// 艾宾浩斯复习间隔：第 1 阶段 1 天，逐级到第 5 阶段 30 天
const SPACED_INTERVALS = { 1:1, 2:3, 3:7, 4:15, 5:30 };
function isISODate(s){
  if(typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [, y, m, d] = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const dt = new Date(Number(y), Number(m) - 1, Number(d));
  return dt.getFullYear() === Number(y) && dt.getMonth() === Number(m) - 1 && dt.getDate() === Number(d);
}
function spacedDateAfter(days, fromISO){
  const d = fromISO ? new Date(fromISO + 'T00:00:00') : new Date();
  d.setDate(d.getDate() + Number(days || 0));
  return dstr(d);
}
function spacedDateCN(s){
  if(!isISODate(s)) return '';
  const d = new Date(s + 'T00:00:00');
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
// 严格校验 HH:MM（00:00-23:59）
function isHHMM(v){
  return typeof v === 'string' && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(v);
}
// 计划时间字段兜底：旧计划没有时间字段时按全天任务处理
function normalizePlan(p){
  if(!p || typeof p !== 'object' || Array.isArray(p)) return null;
  if(!Array.isArray(p.subtasks)) p.subtasks = [];
  const startTime = isHHMM(p.startTime) ? p.startTime : null;
  const endTime = startTime && isHHMM(p.endTime) && p.endTime >= startTime ? p.endTime : null;
  p.startTime = startTime;
  p.endTime = endTime;
  return p;
}
function normalizePlanList(list){
  if(!Array.isArray(list)) return [];
  return list.filter(p => p && typeof p === 'object' && !Array.isArray(p))
    .map(normalizePlan)
    .filter(Boolean);
}
// 计划时间文案：有开始才显示；只填结束或结束早于开始时结束时间已被归一为空
function planTimeRange(p){
  if(!p || !isHHMM(p.startTime)) return '';
  return isHHMM(p.endTime) && p.endTime !== p.startTime ? p.startTime + ' — ' + p.endTime : p.startTime;
}
function planTimeText(p){
  const range = planTimeRange(p);
  return range ? '🕐 ' + range : '';
}
// 今日计划排序：未完成定时在前，未完成全天在后，已完成最后
function sortPlansByTime(list){
  return list.slice().sort((a, b) => {
    const doneA = planStatus(a) === '已完成';
    const doneB = planStatus(b) === '已完成';
    if(doneA !== doneB) return doneA ? 1 : -1;
    const timedA = isHHMM(a.startTime) ? 0 : 1;
    const timedB = isHHMM(b.startTime) ? 0 : 1;
    if(timedA !== timedB) return timedA - timedB;
    const byTime = String(a.startTime || '').localeCompare(String(b.startTime || ''));
    if(byTime) return byTime;
    return (a.createdAt || 0) - (b.createdAt || 0)
      || String(a.title || '').localeCompare(String(b.title || ''), 'zh')
      || String(a.id || '').localeCompare(String(b.id || ''));
  });
}
// 日历同一天排序：定时优先，其次全天；不把已完成项沉底，保证月格子能看到当天安排
function calendarDaySort(a, b){
  const timedA = isHHMM(a.startTime) ? 0 : 1;
  const timedB = isHHMM(b.startTime) ? 0 : 1;
  if(timedA !== timedB) return timedA - timedB;
  const byTime = String(a.startTime || '').localeCompare(String(b.startTime || ''));
  if(byTime) return byTime;
  return (a.createdAt || 0) - (b.createdAt || 0)
    || String(a.title || '').localeCompare(String(b.title || ''), 'zh')
    || String(a.id || '').localeCompare(String(b.id || ''));
}
// 笔记复习字段兜底：旧笔记、导入笔记、快照恢复都走这里
function normalizeNote(n){
  if(!n || typeof n !== 'object' || Array.isArray(n)) return {};
  const rawLevel = Number(n.spacedLevel);
  const level = Number.isInteger(rawLevel) && rawLevel >= 1 && rawLevel <= 5 ? rawLevel : 0;
  if(n.spaced !== true || !level){
    n.spaced = false; n.spacedLevel = 0; n.spacedNext = null;
    return n;
  }
  n.spacedLevel = level;
  if(!isISODate(n.spacedNext)) n.spacedNext = (level === 5 && n.spacedNext === null) ? null : spacedDateAfter(SPACED_INTERVALS[level]); // level=5 且显式 null 表示已掌握；缺失/坏日期按当前间隔补
  return n;
}
function fmtDay(ts){ const d = new Date(ts); return dstr(d); }
function fmtTime(ts){ const d = new Date(ts); return fmtDay(ts) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function markHL(plain, q){
  return markHLMany(plain, q ? [q] : []);
}
// 多关键词高亮：先转义再按词长降序匹配，避免短词破坏长词匹配
function markHLMany(plain, keywords){
  const e = esc(plain);
  const words = (keywords || []).map(x => String(x ?? '').trim()).filter(Boolean)
    .filter((x, i, arr) => arr.findIndex(y => y.toLowerCase() === x.toLowerCase()) === i)
    .map(x => esc(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
    .sort((a, b) => b.length - a.length);
  if(!words.length) return e;
  return e.replace(new RegExp('(' + words.join('|') + ')', 'gi'), '<mark>$1</mark>');
}
function download(name, text, mime){
  const blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function readText(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(file);
  });
}

/* ================= Toast / Modal ================= */
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.textContent = msg;
  $('#toastBox').appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 300); }, 2200);
}
function openModal(title, bodyEl, opts){
  opts = opts || {};
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = '<div class="modal">'
    + '<div class="modal-head"><h3>' + esc(title) + '</h3><button class="modal-x" data-act="modalClose">×</button></div>'
    + '<div class="modal-body"></div>'
    + '<div class="modal-foot"><button class="btn btn-ghost" data-act="modalClose">' + esc(opts.cancelText || '取消') + '</button>'
    + (opts.hideOk ? '' : '<button class="btn btn-primary modal-ok">' + esc(opts.okText || '确定') + '</button>') + '</div></div>';
  mask.querySelector('.modal-body').appendChild(bodyEl);
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', e => {
    if(e.target === mask || e.target.closest('[data-act="modalClose"]')) close();
  });
  const okBtn = mask.querySelector('.modal-ok');
  if(okBtn) okBtn.addEventListener('click', () => {
    const r = opts.onOk ? opts.onOk(bodyEl) : true;
    if(r !== false) close();
  });
  return { close, mask };
}
function confirmModal(msg, onOk){
  const p = document.createElement('p');
  p.className = 'confirm-msg';
  p.textContent = msg;
  openModal('请确认', p, { okText: '确定', onOk(){ onOk && onOk(); return true; } });
}
function promptModal(title, value, onOk){
  const el = document.createElement('div');
  el.innerHTML = '<input type="text" class="pm-input" value="' + esc(value || '') + '">';
  const input = el.querySelector('input');
  openModal(title, el, {
    onOk(){
      const v = input.value.trim();
      if(!v){ toast('内容不能为空', 'error'); return false; }
      onOk(v); return true;
    }
  });
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

/* ================= 主题（四季昼夜） ================= */
const SEASON_POEM = { spring:'春 · 杏花春雨', summer:'夏 · 荷塘月色', autumn:'秋 · 丹桂飘香', winter:'冬 · 踏雪寻梅' };
// 按节气日期与钟点判断季节/昼夜
function getSeasonAndTime(now){
  now = now || new Date();
  const md = (now.getMonth() + 1) * 100 + now.getDate();
  let season;
  if(md >= 204 && md <= 505) season = 'spring';        // 春 2/4~5/5
  else if(md >= 506 && md <= 807) season = 'summer';   // 夏 5/6~8/7
  else if(md >= 808 && md <= 1106) season = 'autumn';  // 秋 8/8~11/6
  else season = 'winter';                              // 冬 11/7~次年2/3
  const h = now.getHours();
  const timeOfDay = (h >= 6 && h < 18) ? 'day' : 'night';
  return { season, timeOfDay };
}
let themeMode = Store.get('theme_mode', 'auto'); // auto | day | night
function applyThemeMode(){
  const { season, timeOfDay } = getSeasonAndTime();
  const eff = themeMode === 'auto' ? timeOfDay : themeMode; // 手动模式强制昼夜
  const root = document.documentElement;
  root.dataset.season = season;
  root.dataset.time = eff;
  delete root.dataset.theme; // 清理旧版暗色标记
  const btn = $('#themeBtn');
  if(btn){
    btn.textContent = themeMode === 'auto' ? '🌗' : themeMode === 'day' ? '☀️' : '🌙';
    btn.title = '主题模式：' + (themeMode === 'auto' ? '自动（随季节昼夜）' : themeMode === 'day' ? '白天' : '黑夜') + '，点击循环切换';
  }
  const poem = $('#seasonPoem');
  if(poem) poem.textContent = SEASON_POEM[season] || '';
  Store.set('theme_mode', themeMode);
}
function cycleThemeMode(){
  themeMode = themeMode === 'auto' ? 'day' : themeMode === 'day' ? 'night' : 'auto';
  applyThemeMode();
}

/* ================= 学习计划逻辑 ================= */
function planProgress(p){
  const t = p.subtasks.length;
  if(!t) return 0;
  return Math.round(p.subtasks.filter(s => s.done).length / t * 100);
}
function planStatus(p){
  const t = p.subtasks.length;
  const d = p.subtasks.filter(s => s.done).length;
  if(t === 0 || d === 0) return '未开始';
  if(d === t) return '已完成';
  return '进行中';
}
function statusClass(st){ return st === '已完成' ? 'st-2' : st === '进行中' ? 'st-1' : 'st-0'; }
function rebuildMarks(){
  const m = {};
  plans.forEach(p => { if(p.date) m[p.date] = (m[p.date] || 0) + 1; });
  marks = m;
  Store.set('calendar_marks', marks);
}
function pruneRef(field, id){
  let changed = false;
  const clean = obj => {
    if(Array.isArray(obj[field]) && obj[field].indexOf(id) >= 0){
      obj[field] = obj[field].filter(x => x !== id); changed = true;
    }
  };
  plans.forEach(p => { clean(p); (p.subtasks || []).forEach(clean); }); // 计划级 + 子任务级
  return changed;
}
function pruneDanglingRefs(){
  let changed = false;
  // 回收站里的同类项也算“存在”：软删除期间保留子任务关联 id，还原后自动恢复
  const trashed = kind => trash.filter(t => t.kind === kind).map(t => t.data);
  const pools = {
    noteIds: notes.concat(trashed('note')),
    linkIds: links.concat(trashed('link')),
    docIds:  kb.files.concat(trashed('doc'))
  };
  plans.forEach(p => {
    [p].concat(p.subtasks || []).forEach(obj => {
      Object.keys(pools).forEach(field => {
        if(!Array.isArray(obj[field])) return;
        const pool = pools[field];
        const before = obj[field].length;
        obj[field] = obj[field].filter(x => pool.some(o => o.id === x));
        if(obj[field].length !== before) changed = true;
      });
    });
  });
  if(changed) Store.set('plans', plans);
  return changed;
}
function savePlans(){
  Store.set('plans', plans);
  rebuildMarks();
  renderPlans(); renderCalendar(); renderToday();
}

/* ================= 数据安全：自动快照 / 回收站 / URL 安全 ================= */
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
// URL 协议白名单：只放行 http/https，挡掉 javascript: 等危险协议（兜底旧数据/导入数据）
function safeUrl(u){
  try{
    const x = new URL(u);
    return (x.protocol === 'http:' || x.protocol === 'https:') ? u : '';
  }catch(e){ return ''; }
}
// 滚动快照：深拷贝当前五大块 + 回收站，最多保留 3 份；写入失败静默（快照是兜底，不打扰用户）
function snapshot(reason){
  try{
    const snap = {
      at: Date.now(), reason: reason || 'manual',
      data: {
        plans: deepCopy(plans), notes: deepCopy(notes), links: deepCopy(links),
        kb: deepCopy(kb), calendar_marks: deepCopy(marks), trash: deepCopy(trash)
      }
    };
    snapshots.unshift(snap);
    snapshots = snapshots.slice(0, 3);
    try{ localStorage.setItem(PREFIX + 'snapshots', JSON.stringify(snapshots)); }
    catch(e){ console.warn('自动快照保存失败（存储空间可能不足）'); }
  }catch(e){ console.warn('自动快照创建失败:', e); }
}
// 从快照恢复数据
function restoreSnapshot(snap){
  const d = (snap && snap.data) || {};
  if(Array.isArray(d.plans)){ plans = normalizePlanList(d.plans); Store.set('plans', plans); }
  if(Array.isArray(d.notes)){ notes = d.notes.filter(n => n && typeof n === 'object' && !Array.isArray(n)).map(normalizeNote); Store.set('notes', notes); }
  if(Array.isArray(d.links)){ links = d.links; Store.set('links', links); }
  if(d.kb && Array.isArray(d.kb.folders)){ kb = d.kb; if(!Array.isArray(kb.files)) kb.files = []; Store.set('kb', kb); }
  if(d.calendar_marks && typeof d.calendar_marks === 'object'){ marks = d.calendar_marks; Store.set('calendar_marks', marks); }
  if(Array.isArray(d.trash)){ trash = d.trash; Store.set('trash', trash); }
  noteCur = null; kbFile = null;
  pruneDanglingRefs();
  rebuildMarks();
  updateTrashBtn();
}
function setMeta(k, v){
  const m = Store.get('meta', {}) || {};
  m[k] = v;
  Store.set('meta', m);
}
// 启动时：空数据自愈提示 + 每日快照 + 导出提醒
function startupBackupAndHeal(){
  const hasData = plans.length || notes.length || links.length || kb.files.length;
  const latest = snapshots[0];
  const snapCount = d => d ? (d.plans ? d.plans.length : 0) + (d.notes ? d.notes.length : 0) + (d.links ? d.links.length : 0) + (d.kb && d.kb.files ? d.kb.files.length : 0) : 0;
  const snapHasData = latest && snapCount(latest.data) > 0;
  if(!hasData && snapHasData){
    // 当前为空但有非空备份：询问是否恢复（不自动恢复，给新设备/主动清空留选择）
    confirmModal('检测到当前数据为空，找到 ' + fmtTime(latest.at) + ' 的自动备份（共 ' + snapCount(latest.data) + ' 条），是否恢复？', () => {
      restoreSnapshot(latest);
      renderAll();
      toast('已从自动备份恢复');
    });
    return; // 本次启动不新建快照
  }
  if(hasData && (!latest || (Date.now() - latest.at) > 24 * 3600 * 1000)) snapshot('daily');
  // 导出提醒：超过 7 天未导出文件备份则提示（快照防写坏，文件备份防清缓存/换设备）
  const meta = Store.get('meta', {}) || {};
  const last = meta.lastExportAt || 0;
  if(hasData && (!last || (Date.now() - last) > 7 * 24 * 3600 * 1000)){
    toast(last ? ('距上次文件备份已 ' + Math.floor((Date.now() - last) / (24 * 3600 * 1000)) + ' 天，建议点侧边栏「导出」备份')
               : '建议点侧边栏「导出」备份一份数据，防止清理缓存时丢失');
  }
}
/* ---- 回收站 ---- */
const TRASH_ICON = { plan:'🗂', note:'📝', link:'🔗', doc:'📄' };
const TRASH_NAME = { plan:'计划', note:'笔记', link:'链接', doc:'文档' };
function moveToTrash(kind, item, name){
  trash.unshift({ id: item.id, kind, name: name || '未命名', data: deepCopy(item), deletedAt: Date.now() });
  Store.set('trash', trash);
  updateTrashBtn();
}
// 彻底删除某类项时级联清理子任务关联 id（plan 不被子任务引用，无需清理）
function purgeRefForKind(kind, id){
  const field = kind === 'note' ? 'noteIds' : kind === 'link' ? 'linkIds' : kind === 'doc' ? 'docIds' : null;
  return field ? pruneRef(field, id) : false;
}
// 启动清理：删除超过 30 天的回收站项
function purgeExpiredTrash(){
  const limit = Date.now() - 30 * 24 * 3600 * 1000;
  const expired = trash.filter(t => t.deletedAt < limit);
  if(!expired.length) return;
  trash = trash.filter(t => t.deletedAt >= limit);
  let changed = false;
  expired.forEach(t => { if(purgeRefForKind(t.kind, t.id)) changed = true; });
  Store.set('trash', trash);
  if(changed) savePlans();
  updateTrashBtn();
}
function restoreTrash(id){
  const idx = trash.findIndex(t => t.id === id);
  if(idx < 0) return;
  const t = trash[idx];
  const exists = t.kind === 'plan' ? plans.some(x => x.id === t.id)
    : t.kind === 'note' ? notes.some(x => x.id === t.id)
    : t.kind === 'link' ? links.some(x => x.id === t.id)
    : kb.files.some(x => x.id === t.id);
  if(!exists){
    if(t.kind === 'plan'){
      const restoredPlan = normalizePlan(t.data);
      if(restoredPlan) plans.unshift(restoredPlan);
    }
    else if(t.kind === 'note') notes.unshift(normalizeNote(t.data));
    else if(t.kind === 'link') links.unshift(t.data);
    else kb.files.unshift(t.data);
  }
  trash.splice(idx, 1);
  Store.set('trash', trash);
  Store.set('plans', plans); Store.set('notes', notes); Store.set('links', links); Store.set('kb', kb);
  pruneDanglingRefs();
  rebuildMarks();
  renderAll();
  updateTrashBtn();
  toast('已还原');
}
function purgeTrashItem(id){
  const idx = trash.findIndex(t => t.id === id);
  if(idx < 0) return;
  const t = trash[idx];
  trash.splice(idx, 1);
  const changed = purgeRefForKind(t.kind, t.id);
  Store.set('trash', trash);
  if(changed) savePlans();
  updateTrashBtn();
}
function emptyTrash(){
  let changed = false;
  trash.forEach(t => { if(purgeRefForKind(t.kind, t.id)) changed = true; });
  trash = [];
  Store.set('trash', trash);
  if(changed) savePlans();
  updateTrashBtn();
}
function updateTrashBtn(){
  const btn = $('#trashBtn');
  if(btn) btn.textContent = trash.length ? '🗑 回收站 (' + trash.length + ')' : '🗑 回收站';
}
function openTrashModal(){
  const body = document.createElement('div');
  const draw = () => {
    body.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;">'
      + '<span style="color:var(--text-2);font-size:13px;">共 ' + trash.length + ' 项 · 删除后保留 30 天</span>'
      + (trash.length ? '<button type="button" class="btn-sm btn-danger" data-act="trashEmpty">清空回收站</button>' : '')
      + '</div>'
      + (trash.length ? trash.map(t =>
        '<div class="trash-row">'
        + '<span class="trash-ico">' + (TRASH_ICON[t.kind] || '📌') + '</span>'
        + '<span class="trash-name">' + esc(t.name) + '</span>'
        + '<span class="trash-kind">' + (TRASH_NAME[t.kind] || '') + '</span>'
        + '<span class="trash-time">' + fmtTime(t.deletedAt) + '</span>'
        + '<span class="trash-acts">'
        + '<button type="button" class="btn-sm" data-act="trashRestore" data-id="' + esc(t.id) + '">还原</button>'
        + '<button type="button" class="btn-sm btn-danger" data-act="trashPurge" data-id="' + esc(t.id) + '">彻底删除</button>'
        + '</span></div>').join('')
        : '<p class="empty">回收站是空的。删除的计划、笔记、链接、文档会先到这里，可还原。</p>');
  };
  draw();
  openModal('🗑 回收站', body, { hideOk: true, cancelText: '关闭' });
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    if(b.dataset.act === 'trashRestore'){ restoreTrash(b.dataset.id); draw(); }
    else if(b.dataset.act === 'trashPurge'){
      confirmModal('彻底删除后无法恢复，确定？', () => { purgeTrashItem(b.dataset.id); draw(); });
    }
    else if(b.dataset.act === 'trashEmpty'){
      confirmModal('清空回收站？所有项将彻底删除且无法恢复。', () => { emptyTrash(); draw(); });
    }
  });
}

/* ================= 批量删除（多选 → 移入回收站，可还原） ================= */
const BATCH_VIEW = { plan:'plans', note:'notes', link:'links', doc:'kb' };
const BATCH_NAME = { plan:'计划', note:'笔记', link:'收藏链接', doc:'文档' };
function batchOn(kind){
  if(batch && batch.kind === kind) batch = null;      // 再点入口按钮=退出
  else batch = { kind, selected:new Set() };
  renderAll();
}
function batchOff(){ batch = null; renderAll(); }
function batchToggleItem(id){
  if(!batch) return;
  if(batch.selected.has(id)) batch.selected.delete(id); else batch.selected.add(id);
  renderAll();
}
function batchVisibleIds(){
  const sec = document.getElementById('view-' + BATCH_VIEW[batch.kind]);
  return Array.from(sec.querySelectorAll('[data-act="batchItem"]')).map(el => el.dataset.id).filter(Boolean);
}
function batchToggleAll(){
  if(!batch) return;
  const ids = batchVisibleIds();
  const allSel = ids.length > 0 && ids.every(id => batch.selected.has(id));
  batch.selected = new Set(allSel ? [] : ids);
  renderAll();
}
function batchBarHTML(){
  if(!batch) return '';
  const ids = batchVisibleIds();
  const allSel = ids.length > 0 && ids.every(id => batch.selected.has(id));
  return '<div class="batch-bar">'
    + '<label class="batch-all"><input type="checkbox" data-act="batchAll"' + (allSel ? ' checked' : '') + '> 全选</label>'
    + '<span class="batch-count">已选 <b>' + batch.selected.size + '</b> 项</span>'
    + '<button type="button" class="btn btn-sm btn-danger" data-act="batchDel"' + (batch.selected.size ? '' : ' disabled') + '>🗑 移入回收站</button>'
    + '<button type="button" class="btn btn-sm" data-act="batchOff">取消</button></div>';
}
// 列表项前的多选勾选框（仅当前模块处于多选时渲染）
function batchCheckbox(kind, id){
  if(!batch || batch.kind !== kind) return '';
  return '<input type="checkbox" class="batch-check" data-act="batchItem" data-id="' + esc(id) + '"' + (batch.selected.has(id) ? ' checked' : '') + '>';
}
function batchDelete(){
  if(!batch || !batch.selected.size) return;
  const kind = batch.kind, ids = Array.from(batch.selected);
  confirmModal('将把选中的 ' + ids.length + ' 个' + BATCH_NAME[kind] + '移入回收站（可在回收站还原），确定？', () => {
    ids.forEach(id => {
      if(kind === 'plan'){ const x = plans.find(p => p.id === id); if(x){ plans = plans.filter(p => p.id !== id); expanded.delete(id); moveToTrash('plan', x, x.title || '未命名计划'); } }
      else if(kind === 'note'){ const x = notes.find(n => n.id === id); if(x){ notes = notes.filter(n => n.id !== id); moveToTrash('note', x, x.title || '无标题笔记'); } }
      else if(kind === 'link'){ const x = links.find(l => l.id === id); if(x){ links = links.filter(l => l.id !== id); moveToTrash('link', x, x.name || '未命名链接'); } }
      else { const x = kb.files.find(f => f.id === id); if(x){ kb.files = kb.files.filter(f => f.id !== id); moveToTrash('doc', x, x.name || '未命名文档'); } }
    });
    Store.set('plans', plans); Store.set('notes', notes); Store.set('links', links); Store.set('kb', kb);
    if(kind === 'plan') rebuildMarks();
    if(kind === 'doc' && kbFile && !kb.files.find(f => f.id === kbFile)) kbFile = null;
    if(kind === 'note' && noteCur && !notes.find(n => n.id === noteCur)) noteCur = null;

// 计划按日期排序
const planByDate = (a, b) => (a.date || '').localeCompare(b.date || '');
// 把计划列表按类型分组：预设类型在前（PLAN_TYPES 顺序），自定义类型按拼音在后
function planGroups(list){
  const map = new Map();
  list.forEach(p => {
    const c = catOf(p);
    if(!map.has(c)) map.set(c, []);
    map.get(c).push(p);
  });
  const groups = [];
  PLAN_TYPES.forEach(t => { if(map.has(t.name)){ groups.push({ name:t.name, icon:t.icon, items:map.get(t.name).slice().sort(planByDate) }); map.delete(t.name); } });
  Array.from(map.keys()).sort((a, b) => a.localeCompare(b, 'zh')).forEach(name => {
    groups.push({ name, icon:catIcon(name), items:map.get(name).slice().sort(planByDate) });
  });
  return groups;
}

}

  fp.forEach(p => { ts += p.subtasks.length; ds += p.subtasks.filter(s => s.done).length; });
  const rate = ts ? Math.round(ds / ts * 100) : (total ? Math.round(done / total * 100) : 0);
  $('#planStats').innerHTML =
    '<div class="stat"><div class="num">' + total + '</div><div class="lbl">总计划数</div></div>'
    + '<div class="stat"><div class="num">' + done + '</div><div class="lbl">已完成</div></div>'
    + '<div class="stat"><div class="num">' + rate + '%</div><div class="lbl">整体完成率</div></div>';
  $('#planTypeNav').innerHTML = planTypeNavHTML(fp); // 子导航计数跟随当前分类筛选（fp）

}

function renderCalendar(){

      .sort(calendarDaySort);

      '<button type="button" class="cal-plan" data-act="calPick" data-date="' + ds + '" title="' + esc(p.title) + '">'

      + (dayPlans.length ? '<div class="cal-plan-list">' + planHTML + moreHTML + '</div>' : '');

    c.dataset.date = ds;

// 解析笔记 AI 整理结果：兼容代码围栏、前后多余文字和花括号截取
function parseAINoteJSON(text){
  const s = String(text || '').trim().replace(/```json/gi, '').replace(/```/g, '').trim();
  const i = s.indexOf('{'), j = s.lastIndexOf('}');
  if(i < 0 || j <= i) throw new Error('bad note json');
  const o = JSON.parse(s.slice(i, j + 1));
  const summary = typeof o.summary === 'string' ? o.summary.trim() : '';
  if(!summary || !Array.isArray(o.tags) || !o.tags.every(t => typeof t === 'string')) throw new Error('bad note result');
  const tags = [];
  o.tags.map(t => t.trim()).filter(Boolean).forEach(t => { if(tags.indexOf(t) < 0) tags.push(t); });
  return { summary, tags };
}

/* ================= 笔记 AI 整理（阶段二 2-4） ================= */
async function tidyCurrentNote(btn){
  saveNoteFromEditor(); // 先保存编辑器中尚未自动落库的标题、标签和正文
  const n = notes.find(x => x.id === noteCur);
  const content = n ? (n.content || '').trim() : '';
  if(!n || !content){
    toast('请先选择或编写笔记内容', 'error');
    return;
  }
  if(!aiConfigReady()){
    toast('请先在侧边栏 ⚙ 设置中配置 AI 服务');
    return;
  }
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '整理中…';
  const system = '你是笔记整理助手。只输出严格 JSON，不要 Markdown 代码围栏，不要解释。JSON 结构必须是：{"summary":"笔记摘要，100字以内","tags":["标签1","标签2","标签3"]}。tags 给 3-5 个关键词标签，每个标签不超过 6 个字。';
  let user = '请根据下面的笔记生成摘要和关键词标签。\n标题：' + (n.title || '无标题') + '\n正文：\n' + content;
  if(content.length < 50) user += '\n内容较短，摘要可直接概括原文。';
  try{
    const r = await callAI(user, { system, temperature:0.3, maxTokens:512, showLoading:true });
    if(!r.ok) return;
    const result = parseAINoteJSON(r.text);
    openNoteTidyPreview(n, result);
  }catch(e){
    toast('AI 返回格式异常，请重试', 'error');
  }finally{
    btn.disabled = false;
    btn.textContent = oldText;
  }
}
function openNoteTidyPreview(n, result){
  const tags = result.tags.slice();
  const el = document.createElement('div');
  el.className = 'form';
  const modal = openModal('✨ AI 整理笔记', el, { hideOk:true, cancelText:'取消' });
  function drawTags(){
    el.querySelector('#ntAiTags').innerHTML = tags.length
      ? tags.map((t, i) => '<span class="nt-ai-tag">' + esc(t) + '<button type="button" data-act="ntAiTagDel" data-i="' + i + '" title="删除标签">×</button></span>').join('')
      : '<span class="empty" style="padding:4px 0">暂无标签，可在下方添加。</span>';
  }
  function draw(){
    el.innerHTML =
      '<label>摘要<textarea rows="4" id="ntAiSummary" placeholder="笔记摘要">' + esc(result.summary) + '</textarea></label>'
      + '<div><div class="f-label">标签</div><div class="nt-ai-tags" id="ntAiTags"></div>'
      + '<div class="nt-ai-add"><input type="text" id="ntAiTagInput" placeholder="输入标签后回车或点添加"><button type="button" class="btn-sm btn-primary" data-act="ntAiTagAdd">添加</button></div></div>'
      + '<div class="ai-form-actions"><button type="button" class="btn btn-primary" data-act="ntAiApply">✅ 采纳</button></div>';
    drawTags();
  }
  function addTag(){
    const input = el.querySelector('#ntAiTagInput');
    const t = input.value.trim();
    if(t && tags.indexOf(t) < 0) tags.push(t);
    input.value = '';
    input.focus();
    drawTags();
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    if(b.dataset.act === 'ntAiTagDel'){
      tags.splice(Number(b.dataset.i), 1);
      drawTags();
    }else if(b.dataset.act === 'ntAiTagAdd'){
      addTag();
    }else if(b.dataset.act === 'ntAiApply'){
      const summary = el.querySelector('#ntAiSummary').value.replace(/\s+/g, ' ').trim();
      if(!summary){ toast('摘要不能为空', 'error'); return; }
      const oldSummary = /^\s*>\s*摘要[：:][^\n]*(?:\n(?:[ \t]*>[^\n]*)+)?\s*/;
      const rest = (n.content || '').replace(oldSummary, '').replace(/^\s+/, '');
      n.content = rest ? '> 摘要：' + summary + '\n\n' + rest : '> 摘要：' + summary;
      const merged = [];
      (Array.isArray(n.tags) ? n.tags : []).concat(tags).forEach(t => {
        t = String(t || '').trim();
        if(t && merged.indexOf(t) < 0) merged.push(t);
      });
      n.tags = merged;
      n.updatedAt = Date.now();
      Store.set('notes', notes);
      renderNotes();
      modal.close();
      toast('已整理');
    }
  });
  el.addEventListener('keydown', e => {
    if(e.target.id === 'ntAiTagInput' && e.key === 'Enter'){
      e.preventDefault();
      addTag();
    }
  });

// 任意关键词命中即返回；命中不同关键词越多排序越前，同分按更新时间降序
function kbSearchHits(keywords, sortByScore){
  const hits = [];
  kb.files.forEach(f => {
    const name = (f.name || '').toLowerCase();
    const content = (f.content || '').toLowerCase();
    const matches = [];
    keywords.forEach(k => {
      const key = String(k || '').trim().toLowerCase();
      if(key && (name.includes(key) || content.includes(key))) matches.push(String(k).trim());
    });
    if(matches.length) hits.push({ file:f, score:matches.length, matches });
  });
  // 普通搜索保持原顺序；AI 扩展才按命中词数和更新时间排序
  return sortByScore
    ? hits.sort((a, b) => b.score - a.score || (b.file.updatedAt || 0) - (a.file.updatedAt || 0))
    : hits;
}

  if(!keywords || keywords.length < 2) return '';

    + keywords.slice(1).map((k, i) =>

// 解析知识库 AI 扩展词：兼容代码围栏、前后多余文字、重复词和大小写差异
function parseAIKeywordsJSON(text, original){
  const s = String(text || '').trim().replace(/```json/gi, '').replace(/```/g, '').trim();
  const i = s.indexOf('{'), j = s.lastIndexOf('}');
  if(i < 0 || j <= i) throw new Error('bad keyword json');
  const o = JSON.parse(s.slice(i, j + 1));
  if(!Array.isArray(o.keywords)) throw new Error('bad keywords');
  const seen = new Set([String(original || '').trim().toLowerCase()]);
  const keywords = [];
  o.keywords.forEach(x => {
    if(typeof x !== 'string') throw new Error('bad keyword item');
    const k = x.trim();
    const key = k.toLowerCase();
    if(k && !seen.has(key)){
      seen.add(key);
      if(keywords.length < 8) keywords.push(k);
    }
  });
  if(!keywords.length) throw new Error('empty keywords');
  return keywords;
}
async function expandKbSearch(btn){
  const q = ($('#kbSearch').value || '').trim();
  if(!q){
    toast('请先输入搜索词', 'error');
    $('#kbSearch').focus();
    return;
  }
  if(!aiConfigReady()){
    toast('请先在侧边栏 ⚙ 设置中配置 AI 服务');
    return;
  }
  const seq = ++kbAIReqSeq;
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '扩展中…';
  const system = '你是关键词扩展助手。用户输入一个搜索词，你输出 5-8 个同义词、近义词或相关词。只输出 JSON，不要解释，不要 Markdown 代码围栏。JSON 结构必须是：{"keywords":["词1","词2","词3"]}。关键词要和原词在同一语义领域，不要太发散。';
  try{
    const r = await callAI('搜索词：' + q, { system, temperature:0.3, maxTokens:200, showLoading:false });
    if(seq !== kbAIReqSeq || ($('#kbSearch').value || '').trim() !== q) return;
    if(!r.ok) return;
    const extras = parseAIKeywordsJSON(r.text, q);
    kbAIKeywords = [q].concat(extras);
    kbFile = null;
    renderKB();
  }catch(e){
    kbAIKeywords = null;
    toast('AI 返回格式异常，请重试', 'error');
  }finally{
    // 旧请求迟到时不要提前恢复按钮，避免覆盖最新一次请求的 loading 状态
    if(seq === kbAIReqSeq){
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }
}

/* ================= AI 服务设置（阶段二 2-1：仅配置与连接测试，不含 AI 生成） ================= */
const AI_DOUBAO_URL = 'https://ark.cn-beijing.volces.com/api/v3/chat/completions';
const AI_AGENT_URL = 'https://ark.cn-beijing.volces.com/api/plan/v3/chat/completions';
const AI_MODELS = ['doubao-pro-32k', 'doubao-lite-32k', 'doubao-1.5-pro-32k'];
const AI_AGENT_MODELS = ['ark-code-latest'];
// 各服务商对应的官方地址（命中则只读，自定义才可编辑）
function aiProviderUrl(prov){ return prov === 'agentplan' ? AI_AGENT_URL : prov === 'doubao' ? AI_DOUBAO_URL : ''; }
// 网页版用 Base64 兜底，仅避免肉眼直接看到 Key，不是真加密；后续打包 App 换成 Keychain/Keystore 安全存储
function b64enc(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return ''; } }
function b64dec(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return ''; } }
// 读取配置：与默认值合并，把存储里的 apiKeyB64 解码成 apiKey；任何字段异常都兜底
function loadAIConfig(){
  const raw = Store.get('ai_config', null) || {};
  const cfg = {
    mode: raw.mode === 'A' ? 'A' : 'B',
    provider: ['doubao','agentplan','custom'].indexOf(raw.provider) >= 0 ? raw.provider : 'doubao',
    apiKey: '',
    model: typeof raw.model === 'string' ? raw.model : '',
    apiUrl: typeof raw.apiUrl === 'string' && raw.apiUrl ? raw.apiUrl : AI_DOUBAO_URL
  };
  if(raw.apiKeyB64) cfg.apiKey = b64dec(raw.apiKeyB64);
  return cfg;
}
// 保存配置：只写 apiKeyB64，绝不写明文 apiKey
function saveAIConfig(cfg){
  const out = {
    mode: cfg.mode === 'A' ? 'A' : 'B',
    provider: ['doubao','agentplan','custom'].indexOf(cfg.provider) >= 0 ? cfg.provider : 'doubao',
    model: cfg.model || '',
    apiUrl: cfg.apiUrl || '',
    apiKeyB64: cfg.apiKey ? b64enc(cfg.apiKey) : ''
  };
  return Store.set('ai_config', out);
}
function aiCollect(el){
  return {
    mode: ((el.querySelector('input[name="aiMode"]:checked') || {}).value) || 'B',
    provider: el.querySelector('#aiProvider').value,
    apiKey: el.querySelector('#aiKey').value.trim(),
    model: el.querySelector('#aiModel').value.trim(),
    apiUrl: el.querySelector('#aiUrl').value.trim()
  };
}
function openSettingsModal(){
  const cfg = loadAIConfig();
  const el = document.createElement('div');
  el.innerHTML =
    '<div class="form">'

// 真实发起一次最小对话请求验证 Key；15 秒超时
function runAITest(el, btn, resultEl){
  const c = aiCollect(el);
  if(c.mode === 'A'){ resultEl.textContent = '创作者预置服务即将开放'; toast('创作者预置服务即将开放'); return; }
  if(!c.apiKey){ toast('请先填写 API Key', 'error'); return; }
  if(!c.model){ toast('请先填写模型名', 'error'); return; }
  if(!c.apiUrl || !/^https?:\/\//i.test(c.apiUrl)){ toast('API 地址不正确', 'error'); return; }
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '测试中…'; resultEl.textContent = '';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  fetch(c.apiUrl, {
    method:'POST',
    headers:{ 'Authorization':'Bearer ' + c.apiKey, 'Content-Type':'application/json' },
    body: JSON.stringify({ model:c.model, messages:[{role:'user', content:'你好，请只回复两个字：收到'}], max_tokens:10 }),
    signal: ctrl.signal
  }).then(async res => {
    let data = null; try{ data = await res.json(); }catch(e){ /* 非 JSON 响应按状态码处理 */ }
    const msg = data && data.error && data.error.message ? String(data.error.message) : '';
    if(res.ok && data && data.choices && data.choices[0] && data.choices[0].message){
      const reply = (data.choices[0].message.content || '').trim();
      resultEl.textContent = '✅ ' + (data.model || c.model) + '：' + (reply || '（空回复）');
      toast('连接成功，AI 服务可用');
    }else if(res.status === 401 || res.status === 403){
      resultEl.textContent = '❌ API Key 无效'; toast('API Key 无效', 'error');
    }else if(res.status === 404){
      resultEl.textContent = '❌ 接口地址或模型有误（404）'; toast('接口地址或模型有误', 'error');
    }else{
      resultEl.textContent = '❌ HTTP ' + res.status + (msg ? ' · ' + msg.slice(0, 40) : '');
      toast('连接失败：HTTP ' + res.status, 'error');
    }
  }).catch(err => {
    if(err && err.name === 'AbortError'){ resultEl.textContent = '❌ 请求超时（15 秒）'; toast('请求超时', 'error'); }
    else { resultEl.textContent = '❌ 无法连接，请检查地址和网络'; toast('无法连接，请检查地址和网络', 'error'); }
  }).finally(() => { clearTimeout(timer); btn.disabled = false; btn.textContent = oldText; });
}

// 模式 A（创作者预置）占位：后续创作者提供 Key 和接口后填这里，不要硬编码在函数里
const CREATOR_AI_CONFIG = { apiUrl:'', apiKey:'', model:'' };
let aiLoadingCount = 0; // 并发调用计数：归零才隐藏遮罩
// 懒创建全屏 loading 遮罩
function aiLoadingShow(){
  aiLoadingCount++;
  let el = document.getElementById('aiLoadingMask');
  if(!el){
    el = document.createElement('div');
    el.id = 'aiLoadingMask';
    el.className = 'ai-loading';
    el.hidden = true;
    el.innerHTML = '<div class="ai-spinner"></div><div class="ai-loading-text">AI 思考中…</div>';
    document.body.appendChild(el);
  }
  el.hidden = false;
}
function aiLoadingHide(){
  aiLoadingCount = Math.max(0, aiLoadingCount - 1);
  if(aiLoadingCount === 0){ const el = document.getElementById('aiLoadingMask'); if(el) el.hidden = true; }
}
function aiWait(ms){ return new Promise(r => setTimeout(r, ms)); }
// 按 HTTP 状态码映射具体错误
function aiHttpError(status){
  if(status === 401 || status === 403) return 'API Key 无效，请检查设置';
  if(status === 404) return '接口地址或模型名称有误';
  if(status === 429) return '请求过于频繁，请稍后再试';
  if(status === 500 || status === 502 || status === 503 || status === 504) return 'AI 服务暂时不可用，请稍后重试';
  return '连接失败：HTTP ' + status;
}

// 单次请求（不内部重试）；成功返回 raw JSON，失败抛出标记
async function aiOnce(cfg, payload, timeout){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  let res;
  try{
    res = await fetch(cfg.apiUrl, {
      method:'POST',
      headers:{ 'Authorization':'Bearer ' + cfg.apiKey, 'Content-Type':'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
  }catch(err){
    clearTimeout(timer);
    throw (err && err.name === 'AbortError') ? '__TIMEOUT__' : '__NET__';
  }
  clearTimeout(timer);
  if(!res.ok){ throw { kind:'__HTTP__', message:aiHttpError(res.status) }; }
  try{ return await res.json(); }catch(e){ throw { kind:'__HTTP__', message:'AI 返回格式异常' }; }
}

/**
 * 统一 AI 调用。永远 resolve、不 reject。
 * @returns {Promise<{ok:boolean,text:string,error:?(string),raw:?(object)}>}
 * opts: system/temperature/maxTokens/timeout(30000)/retries(1)/showLoading(true)/onProgress(预留流式，本版忽略)
 */
async function callAI(prompt, opts){
  opts = opts || {};
  const o = {
    system: typeof opts.system === 'string' ? opts.system : '',
    temperature: typeof opts.temperature === 'number' ? opts.temperature : 0.7,
    maxTokens: typeof opts.maxTokens === 'number' ? opts.maxTokens : 1024,
    timeout: typeof opts.timeout === 'number' ? opts.timeout : 30000,
    retries: typeof opts.retries === 'number' ? opts.retries : 1,
    showLoading: opts.showLoading !== false,
    onProgress: typeof opts.onProgress === 'function' ? opts.onProgress : null // 预留流式接口，后续实现，本版忽略
  };
  const fail = error => { if(o.showLoading) aiLoadingHide(); toast(error, 'error'); return { ok:false, text:'', error, raw:null }; };

  const saved = loadAIConfig();
  let cfg;
  if(saved.mode === 'A'){
    cfg = { apiUrl:CREATOR_AI_CONFIG.apiUrl, apiKey:CREATOR_AI_CONFIG.apiKey, model:CREATOR_AI_CONFIG.model };
    if(!cfg.apiUrl || !cfg.apiKey || !cfg.model) return fail('创作者预置服务即将开放，暂不可用');
  }else{
    cfg = { apiUrl:saved.apiUrl, apiKey:saved.apiKey, model:saved.model };
    if(!cfg.apiKey || !cfg.model) return fail('请先在设置中配置 AI 服务（点侧边栏 ⚙ 设置）');
    if(!cfg.apiUrl || !/^https?:\/\//i.test(cfg.apiUrl)) return fail('API 地址不正确，请在设置中检查');
  }

  const messages = [];
  if(o.system) messages.push({ role:'system', content:o.system });
  messages.push({ role:'user', content:prompt });
  const payload = { model:cfg.model, messages, temperature:o.temperature, max_tokens:o.maxTokens };

  if(o.showLoading) aiLoadingShow();
  let lastErr = '', retriable = false;
  for(let attempt = 0; attempt <= o.retries; attempt++){
    try{
      const data = await aiOnce(cfg, payload, o.timeout);
      if(!data || !data.choices || !data.choices[0] || !data.choices[0].message){
        if(o.showLoading) aiLoadingHide();
        toast('AI 返回格式异常', 'error');
        return { ok:false, text:'', error:'AI 返回格式异常', raw:null };
      }
      const text = String(data.choices[0].message.content || '');
      if(o.showLoading) aiLoadingHide();
      return { ok:true, text:text.trim(), error:null, raw:data };
    }catch(err){
      if(err === '__TIMEOUT__'){ lastErr = '请求超时（' + Math.round(o.timeout / 1000) + '秒），请检查网络或稍后重试'; retriable = true; }
      else if(err === '__NET__'){ lastErr = '无法连接到 AI 服务，请检查网络和 API 地址'; retriable = true; }
      else { lastErr = (err && err.message) || '连接失败'; retriable = false; }
      // 仅网络错误 / 超时才重试；HTTP 状态码（含 401/429/5xx）立即返回
      if(retriable && attempt < o.retries){ await aiWait(1000); continue; }
      break;
    }
  }
  if(o.showLoading) aiLoadingHide();
  toast(lastErr, 'error');
  return { ok:false, text:'', error:lastErr, raw:null };
}

// 解析 AI 返回：兼容 ```json 围栏和前后多余文字，只截取首个花括号到末个花括号
function parseAIPlanJSON(text){
  let s = String(text || '').trim().replace(/```json/gi, '').replace(/```/g, '').trim();
  const i = s.indexOf('{'), j = s.lastIndexOf('}');
  if(i < 0 || j <= i) throw new Error('bad json');
  const o = JSON.parse(s.slice(i, j + 1));
  const title = typeof o.title === 'string' ? o.title.trim() : '';
  const subtasks = Array.isArray(o.subtasks)
    ? o.subtasks.map(x => typeof x === 'string' ? x.trim() : '').filter(Boolean)
    : [];
  if(!title || !subtasks.length) throw new Error('bad plan');
  return { title, subtasks };
}
