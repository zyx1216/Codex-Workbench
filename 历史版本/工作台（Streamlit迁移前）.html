/* ================= AI 周/月复盘报告（阶段二 2-5） ================= */
// ISO 周序号：周一为一周开始，用于「2026年第37周复盘报告」这类标题
function isoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return { year:d.getUTCFullYear(), week:Math.ceil((((d - yearStart) / 86400000) + 1) / 7) };
}
function reportRange(kind, custom){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  let start, end, label, title, tag;
  if(kind === 'month'){
    start = dstr(new Date(y, m, 1));
    end = dstr(new Date(y, m + 1, 0));
    label = '本月';
    title = y + '年' + (m + 1) + '月复盘报告';
    tag = '月报';
  }else if(kind === 'last7'){
    end = todayStr();
    start = addDaysISO(-6);
    label = '最近 7 天';
    title = start + '至' + end + '复盘报告';
    tag = '周报';
  }else if(kind === 'custom'){
    start = custom && custom.start;
    end = custom && custom.end;
    label = '自定义周期';
    title = start + '至' + end + '复盘报告';
    tag = '复盘';
  }else{
    kind = 'week';
    const offset = (now.getDay() + 6) % 7; // 周一为 0
    const ws = new Date(y, m, now.getDate() - offset);
    start = dstr(ws);
    end = dstr(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 6));
    label = '本周';
    const iw = isoWeekNumber(now);
    title = iw.year + '年第' + iw.week + '周复盘报告';
    tag = '周报';
  }
  return { kind, start, end, label, title, tag };
}
// 报告统计：AI 只接收这里算出的真实数据，不允许自行猜测
function collectReportStats(start, end){
  const inRange = s => s >= start && s <= end;
  const periodPlans = plans.filter(p => p.date && inRange(p.date));
  const donePlans = periodPlans.filter(p => planStatus(p) === '已完成');
  const groups = [];
  const groupMap = new Map();
  periodPlans.forEach(p => {
    const c = catOf(p);
    if(!groupMap.has(c)) groupMap.set(c, { name:c, total:0, done:0 });
    const g = groupMap.get(c);
    g.total++;
    if(planStatus(p) === '已完成') g.done++;
  });
  groupMap.forEach(g => { g.rate = g.total ? Math.round(g.done / g.total * 100) : 0; groups.push(g); });
  groups.sort((a, b) => (b.rate - a.rate) || (b.done - a.done) || (b.total - a.total) || a.name.localeCompare(b.name, 'zh'));
  const unfinished = periodPlans.filter(p => planStatus(p) !== '已完成').slice(0, 5);
  const ts = x => {
    const n = typeof x.createdAt === 'number' ? x.createdAt : (typeof x.updatedAt === 'number' ? x.updatedAt : NaN);
    return Number.isFinite(n) ? n : NaN;
  };
  return {
    planTotal: periodPlans.length,
    planDone: donePlans.length,
    planRate: periodPlans.length ? Math.round(donePlans.length / periodPlans.length * 100) : 0,
    activeDays: new Set(periodPlans.map(p => p.date)).size,
    newNotes: notes.filter(n => {
      const t = ts(n), d = fmtDay(t);
      return Number.isFinite(t) && inRange(d);
    }).length,
    newLinks: links.filter(l => typeof l.createdAt === 'number' && Number.isFinite(l.createdAt) && inRange(fmtDay(l.createdAt))).length,
    topCategory: groups[0] || null,
    unfinishedTotal: periodPlans.length - donePlans.length,
    unfinished
  };
}
function buildReportPrompt(period, stats){
  const top = stats.topCategory ? stats.topCategory.name + '（完成率 ' + stats.topCategory.rate + '%）' : '无';
  const unfinishedText = stats.unfinished.length
    ? stats.unfinished.map((p, i) => (i + 1) + '. ' + (p.title || '无标题')).join('\n')
      + (stats.unfinishedTotal > stats.unfinished.length ? '\n等 ' + stats.unfinishedTotal + ' 个' : '')
    : '无';
  return '报告周期：' + period.label + '（' + period.start + ' 至 ' + period.end + '）\n\n'
    + '真实统计数据：\n'
    + '- 计划总数：' + stats.planTotal + '\n'
    + '- 已完成计划：' + stats.planDone + '\n'
    + '- 计划完成率：' + stats.planRate + '%\n'
    + '- 新增笔记：' + stats.newNotes + ' 篇\n'
    + '- 新增收藏：' + stats.newLinks + ' 个\n'
    + '- 有计划的活跃天数：' + stats.activeDays + ' 天\n'
    + '- 完成率最高的分类：' + top + '\n'
    + '- 未完成计划：' + stats.unfinishedTotal + ' 个\n' + unfinishedText + '\n\n'
    + '请基于以上真实数据写复盘报告，包含：①本期概览 ②亮点 ③待改进 ④下期建议。500 字以内，统一使用「计划」「任务」等通用说法。';
}
function openReportModal(){
  if(!aiConfigReady()){
    toast('请先在侧边栏 ⚙ 设置中配置 AI 服务');
    return;
  }
  const state = { kind:'week', customStart:todayStr(), customEnd:todayStr(), report:'', period:null };
  const el = document.createElement('div');
  el.className = 'form';
  const modal = openModal('📊 AI 复盘报告', el, { hideOk:true, cancelText:'取消' });
  function currentPeriod(){
    return reportRange(state.kind, { start:state.customStart, end:state.customEnd });
  }
  function renderForm(){
    el.innerHTML =
      '<div class="ai-report-range">'
      + '<label><input type="radio" name="reportRange" value="week"' + (state.kind === 'week' ? ' checked' : '') + '>本周（周一到周日）</label>'
      + '<label><input type="radio" name="reportRange" value="month"' + (state.kind === 'month' ? ' checked' : '') + '>本月</label>'
      + '<label><input type="radio" name="reportRange" value="last7"' + (state.kind === 'last7' ? ' checked' : '') + '>最近 7 天</label>'
      + '<label><input type="radio" name="reportRange" value="custom"' + (state.kind === 'custom' ? ' checked' : '') + '>自定义</label>'
      + '</div><div class="ai-report-custom">'
      + '<label>开始日期<input type="date" id="reportStart" value="' + esc(state.customStart) + '"></label>'
      + '<label>结束日期<input type="date" id="reportEnd" value="' + esc(state.customEnd) + '"></label></div>'
      + '<div class="ai-form-actions"><button type="button" class="btn btn-primary" data-act="reportGenerate">✨ 生成报告</button></div>';
  }
  function renderPreview(){
    el.innerHTML = '<div class="ai-report-preview md-preview">' + renderMd(state.report) + '</div>'
      + '<div class="ai-form-actions">'
      + '<button type="button" class="btn btn-ghost" data-act="reportBack">← 重新生成</button>'
      + '<button type="button" class="btn" data-act="reportExport">⬇ 导出 .md</button>'
      + '<button type="button" class="btn btn-primary" data-act="reportSave">💾 保存为笔记</button></div>';
  }
  async function generate(){
    state.kind = (el.querySelector('input[name="reportRange"]:checked') || {}).value || 'week';
    state.customStart = el.querySelector('#reportStart').value;
    state.customEnd = el.querySelector('#reportEnd').value;
    if(state.kind === 'custom'){
      if(!state.customStart || !state.customEnd){ toast('请选择自定义开始和结束日期', 'error'); return; }
      if(state.customEnd < state.customStart){ toast('结束日期不能早于开始日期', 'error'); return; }
    }
    const period = currentPeriod();
    const stats = collectReportStats(period.start, period.end);
    const btn = el.querySelector('[data-act="reportGenerate"]');
    btn.disabled = true;
    btn.textContent = '生成中…';
    const system = '你是个人效率复盘助手。基于用户提供的真实数据写一份简洁、有洞察力的复盘报告。不要编造数据，只基于提供的数据。用中文，语气鼓励但不浮夸。输出 Markdown 或纯文本，不要 JSON，不要 Markdown 代码围栏。报告包含本期概览、亮点、待改进、下期建议四部分，500 字以内。统一使用「计划」「任务」等通用说法。';
    const r = await callAI(buildReportPrompt(period, stats), { system, temperature:0.7, maxTokens:1024, showLoading:true });
    const oldBtn = el.querySelector('[data-act="reportGenerate"]');
    if(oldBtn){ oldBtn.disabled = false; oldBtn.textContent = '✨ 生成报告'; }
    if(!r.ok) return;
    const text = (r.text || '').trim();
    if(!text){ toast('AI 返回内容为空，请重试', 'error'); return; }
    state.period = period;
    state.report = text;
    renderPreview();
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    if(b.dataset.act === 'reportGenerate') generate();
    else if(b.dataset.act === 'reportBack') renderForm();
    else if(b.dataset.act === 'reportExport'){
      download(state.period.title + '.md', '# ' + state.period.title + '\n\n' + state.report, 'text/markdown;charset=utf-8');
      toast('报告已导出');
    }else if(b.dataset.act === 'reportSave'){
      const now = Date.now();
      const n = { id:uid(), title:state.period.title, content:state.report, tags:[state.period.tag], category:'默认', spaced:false, spacedLevel:0, spacedNext:null, createdAt:now, updatedAt:now };
      notes.push(n);
      Store.set('notes', notes);
      modal.close();
      jumpToNote(n.id);
      toast('报告已保存为笔记');
    }
  });
  el.addEventListener('change', e => {
    if(e.target.name === 'reportRange') state.kind = e.target.value;
    if(e.target.id === 'reportStart' || e.target.id === 'reportEnd'){
      state.kind = 'custom';
      const radio = el.querySelector('input[name="reportRange"][value="custom"]');
      if(radio) radio.checked = true;
    }
  });
  renderForm();
}

    case 'batchItem': batchToggleItem(b.dataset.id); break;
    case 'batchAll': batchToggleAll(); break;
    case 'batchDel': batchDelete(); break;
    case 'planEdit': openPlanModal(id); break;
    case 'planDel':
      confirmModal('确定删除该计划及其子任务？', () => {
        const p = plans.find(x => x.id === id);
        plans = plans.filter(x => x.id !== id);
        expanded.delete(id);
        if(p) moveToTrash('plan', p, p.title || '未命名计划');
        savePlans(); toast('已移入回收站，可在回收站还原');
      });
      break;
    case 'subNote': openSubPicker(b.dataset.plan, b.dataset.sub, 'noteIds'); break;
    case 'subLink': openSubPicker(b.dataset.plan, b.dataset.sub, 'linkIds'); break;
    case 'subDoc': openSubPicker(b.dataset.plan, b.dataset.sub, 'docIds'); break;
    case 'planNote': openPlanPicker(b.dataset.plan, 'noteIds'); break;
    case 'planLink': openPlanPicker(b.dataset.plan, 'linkIds'); break;
    case 'planDoc': openPlanPicker(b.dataset.plan, 'docIds'); break;
    case 'noteJump': jumpToNote(b.dataset.nid); break;
    case 'docJump': jumpToDoc(b.dataset.did); break;
    case 'linkOpen': break;
    case 'catFilter': activeCategory = (activeCategory === b.dataset.cat ? null : b.dataset.cat); batch = null; renderAll(); break;
    case 'filterClear': activeCategory = null; batch = null; renderAll(); break;
    case 'todayFold': todayFold[b.dataset.key] = !todayFold[b.dataset.key]; renderToday(); break;
    case 'todayView': todayView = { kind: b.dataset.kind, id: b.dataset.rid }; renderToday(); break;
    case 'todayViewClose': todayView = null; renderToday(); break;
    case 'todayReport': openReportModal(); break;
    case 'todayPlanExpand': if(todayCollapsed.has(id)) todayCollapsed.delete(id); else todayCollapsed.add(id); renderToday(); break;
    case 'todayEdit': {
      if(todayView){ const v = todayView; todayView = null;
        if(v.kind === 'note') jumpToNote(v.id); else jumpToDoc(v.id);
        renderToday(); }
      break;
    }
    case 'planExpand':
      if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
      renderPlans();
      break;
    case 'noteOpen':
      noteCur = id; noteMode = 'edit'; renderNotes(); break;
    case 'noteTag':
      noteTag = noteTag === b.dataset.tag ? '' : b.dataset.tag; renderNoteList(); break;
    case 'noteMode':
      if(noteMode !== b.dataset.mode){
        if($('#ntBody')) saveNoteFromEditor();
        noteMode = b.dataset.mode; renderNoteEditor();
      }
      break;
    case 'noteSpacedToggle': toggleSpacedReview(); break;
    case 'reviewRemember': reviewSpacedNote(id, true); break;
    case 'reviewForgot': reviewSpacedNote(id, false); break;
    case 'noteAITidy': tidyCurrentNote(b); break;
    case 'noteExportOne': {
      const n = notes.find(x => x.id === noteCur);
      if(n) download((n.title || 'note') + '.md', '# ' + n.title + '\n\n' + n.content, 'text/markdown;charset=utf-8');
      break;
    }
    case 'noteDel': {
      const n = notes.find(x => x.id === noteCur);
      if(n) confirmModal('确定删除笔记「' + (n.title || '无标题') + '」？', () => {
        const delId = noteCur;
        notes = notes.filter(x => x.id !== delId);
        noteCur = null; Store.set('notes', notes);
        moveToTrash('note', n, n.title || '无标题笔记'); // 软删除：子任务关联 id 保留，还原后恢复
        renderNotes(); toast('已移入回收站，可在回收站还原');
      });
      break;
    }
    case 'linkEdit': openLinkModal(id); break;
    case 'linkDel':
      confirmModal('确定删除该链接？', () => {
        const l = links.find(x => x.id === id);
        links = links.filter(x => x.id !== id);
        Store.set('links', links);
        if(l) moveToTrash('link', l, l.name || '未命名链接');
        renderLinks(); toast('已移入回收站，可在回收站还原');
      });
      break;
    case 'catRename': {
      const old = b.dataset.cat;
      promptModal('重命名分类', old === '未分类' ? '' : old, name => {
        const key = old === '未分类' ? '' : old;
        links.forEach(l => { if((l.category || '') === key) l.category = name; });
        Store.set('links', links); renderLinks();
      });
      break;
    }
    case 'catDel': {
      const cat = b.dataset.cat;
      confirmModal('删除分类「' + cat + '」？该分类下的链接将移至「未分类」，不会被删除。', () => {
        const key = cat === '未分类' ? '' : cat;
        links.forEach(l => { if((l.category || '') === key) l.category = ''; });
        Store.set('links', links); renderLinks(); toast('分类已删除');
      });
      break;
    }
    case 'kbOpen':
      kbCur = b.dataset.fid || null; kbFile = null;
      resetKbSearch();
      renderKB();
      break;
    case 'kbAIRemove': {
      const i = Number(b.dataset.i);
      if(kbAIKeywords && i > 0 && i < kbAIKeywords.length){
        kbAIKeywords.splice(i, 1);
        if(kbAIKeywords.length <= 1) kbAIKeywords = null;
        renderKB();
      }
      break;
    }
    case 'kbFolderAdd': openFolderModal(b.dataset.fid); break;
    case 'kbFolderRen': openFolderModal(null, b.dataset.fid); break;
    case 'kbFolderDel': deleteFolder(b.dataset.fid); break;
    case 'kbFileNew':
      promptModal('新建文本文档', '未命名文档.txt', name => {
        kb.files.push({ id: uid(), name, folderId: kbCur, content: '', updatedAt: Date.now() });
        saveKb();
      });
      break;
    case 'kbOpenFile': resetKbSearch(); kbFile = id; renderKB(); break;
    case 'kbFileBack': kbFile = null; resetKbSearch(); renderKB(); break;
    case 'kbFileRen': {
      const f = kb.files.find(x => x.id === id);
      if(f) promptModal('重命名文件', f.name, name => { f.name = name; f.updatedAt = Date.now(); saveKb(); });
      break;
    }
    case 'kbFileMove': moveFileModal(id); break;
    case 'kbFileDel': {
      const f = kb.files.find(x => x.id === id);
      if(f) confirmModal('确定删除文件「' + f.name + '」？将移入回收站，可在回收站还原。', () => {
        kb.files = kb.files.filter(x => x.id !== id);
        if(kbFile === id) kbFile = null;
        moveToTrash('doc', f, f.name || '未命名文档');
        saveKb();
        toast('已移入回收站，可在回收站还原');
      });
      break;
    }
  }
});
// 全局勾选委托（子任务）
document.addEventListener('change', e => {
  const b = e.target.closest('[data-act="subToggle"]');
  if(!b) return;
  const p = plans.find(x => x.id === b.dataset.plan);
  const s = p && p.subtasks.find(x => x.id === b.dataset.sub);
  if(s){
    s.done = b.checked;
    savePlans();
  }
});

/* ================= 启动 ================= */
applyThemeMode();
setInterval(applyThemeMode, 10 * 60 * 1000); // 每 10 分钟重判（自动模式跟随昼夜，手动模式保持）
initCal();
purgeExpiredTrash();      // 清理回收站中超过 30 天的项
pruneDanglingRefs();
startupBackupAndHeal();   // 空数据自愈提示 + 每日快照 + 导出提醒
rebuildMarks();
updateTrashBtn();
renderAll();
</script>
</body>
</html>
