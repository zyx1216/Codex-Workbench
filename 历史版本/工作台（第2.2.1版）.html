<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人学习工作台</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f1f4fa; --border:#e2e8f2;
  --text:#1f2937; --text-2:#6b7280; --primary:#2563eb; --primary-hover:#1d4ed8;
  --primary-soft:#dbeafe; --danger:#dc2626; --danger-soft:#fee2e2;
  --green:#16a34a; --green-soft:#dcfce7; --amber:#d97706; --amber-soft:#fef3c7;
  --gray:#64748b; --gray-soft:#eef2f7;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 6px 16px rgba(16,24,40,.06);
  --radius:14px;
  --accent:#2563eb; --on-primary:#ffffff;
}
/* ===== 四季昼夜主题：data-season + data-time 覆盖变量 ===== */
[data-season="spring"][data-time="day"]{
  --bg:#f0f7e8; --surface:#ffffff; --surface-2:#e6f0d8; --border:#d2e0bf;
  --text:#22300f; --text-2:#4d5a3a;
  --primary:#4e7c2a; --primary-hover:#3c6120; --primary-soft:#ddeccb;
  --accent:#c2185b; --on-primary:#ffffff;
}
[data-season="spring"][data-time="night"]{
  --bg:#1a2a1f; --surface:#22352a; --surface-2:#2c4134; --border:#3a5142;
  --text:#e8f0e2; --text-2:#b3c4a8;
  --primary:#7cb342; --primary-hover:#9ccc65; --primary-soft:#33452a;
  --accent:#f48fb1; --on-primary:#16240c;
}
[data-season="summer"][data-time="day"]{
  --bg:#e3f2fd; --surface:#ffffff; --surface-2:#d3e7fa; --border:#c2d9ee;
  --text:#0d2233; --text-2:#3f5870;
  --primary:#0277bd; --primary-hover:#015a8c; --primary-soft:#c6e4fb;
  --accent:#2e7d32; --on-primary:#ffffff;
}
[data-season="summer"][data-time="night"]{
  --bg:#0d1f2d; --surface:#142c3f; --surface-2:#1c3a52; --border:#274b63;
  --text:#e6f1fb; --text-2:#a9c2d8;
  --primary:#29b6f6; --primary-hover:#5cc8ff; --primary-soft:#16384f;
  --accent:#66bb6a; --on-primary:#06182a;
}
[data-season="autumn"][data-time="day"]{
  --bg:#fff8e1; --surface:#ffffff; --surface-2:#fdf0d0; --border:#f0e0b0;
  --text:#33220a; --text-2:#6b5630;
  --primary:#c8430a; --primary-hover:#a83800; --primary-soft:#ffe4c4;
  --accent:#bf6b3b; --on-primary:#ffffff;
}
[data-season="autumn"][data-time="night"]{
  --bg:#2a1f10; --surface:#382a17; --surface-2:#473520; --border:#5a442a;
  --text:#f6ecdc; --text-2:#d3bd97;
  --primary:#ffb300; --primary-hover:#ffc94d; --primary-soft:#4d3a17;
  --accent:#d87b4a; --on-primary:#2a1a02;
}
[data-season="winter"][data-time="day"]{
  --bg:#eceff1; --surface:#ffffff; --surface-2:#dde3e7; --border:#cdd5db;
  --text:#1c2733; --text-2:#455564;
  --primary:#455a64; --primary-hover:#31444d; --primary-soft:#d3dce1;
  --accent:#8d6e63; --on-primary:#ffffff;
}
[data-season="winter"][data-time="night"]{
  --bg:#121a21; --surface:#1b2630; --surface-2:#25323d; --border:#33424f;
  --text:#e7edf3; --text-2:#a9b7c4;
  --primary:#78909c; --primary-hover:#9bb0bb; --primary-soft:#263540;
  --accent:#b08577; --on-primary:#0e161c;
}
/* 夜主题统一加深阴影 */
[data-time="night"]{ --shadow:0 1px 3px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.35); }
/* 主题切换仅过渡颜色，不过渡布局 */
body,.sidebar,.card,.modal,.toast,.plan-card,.plan-item,.note-item,.link-card,.cal-cell,.filter-bar,.cat-item,.fav,.tag,.mini-tag,.badge,.cat-badge,input,textarea,select,.md-preview,.fold-head,.tv-panel{
  transition:background-color .5s ease,border-color .5s ease,color .5s ease;
}
.brand-poem{font-size:11px;color:var(--text-2);padding:0 4px;margin-top:-6px;white-space:nowrap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--primary);text-decoration:none}

/* ============ 左侧侧边栏 ============ */
.sidebar{
  position:fixed;top:0;left:0;width:220px;height:100vh;
  display:flex;flex-direction:column;gap:14px;padding:18px 14px;
  background:var(--surface);border-right:1px solid var(--border);z-index:50;
}
.brand{font-weight:700;font-size:18px;white-space:nowrap;color:var(--primary);padding:0 4px}
.side-menu{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.tab{
  display:block;width:100%;text-align:left;
  border:none;background:transparent;padding:10px 14px;border-radius:10px;
  color:var(--text-2);white-space:nowrap;font-size:14px;
}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side-actions{display:flex;flex-direction:column;gap:8px}
.side-actions .icon-btn{width:100%;padding:9px 14px}
/* 分类筛选（侧边栏） */
.cat-area{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.cat-title{font-size:12px;color:var(--text-2);padding:0 4px;font-weight:600}
.cat-list{display:flex;flex-direction:column;gap:2px;max-height:190px;overflow-y:auto}
.cat-item{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;padding:7px 10px;border-radius:8px;color:var(--text-2);font-size:13px;text-align:left}
.cat-item:hover{background:var(--surface-2)}
.cat-item.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.cat-item .cat-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item .cat-count{font-size:11px;background:var(--surface-2);border-radius:10px;padding:0 7px;color:var(--text-2)}
.cat-item.on .cat-count{background:var(--surface);color:var(--primary)}
.cat-manage{width:100%;margin-top:2px}
.cat-badge{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--text-2);background:var(--surface-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
/* 回收站弹窗列表 */
.trash-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--surface)}
.trash-row:hover{background:var(--surface-2)}
.trash-ico{font-size:16px}
.trash-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.trash-kind{font-size:11px;color:var(--text-2);background:var(--surface-2);border-radius:6px;padding:0 7px;white-space:nowrap}
.trash-time{font-size:11px;color:var(--text-2);white-space:nowrap}
.trash-acts{display:flex;gap:6px;white-space:nowrap}
.ne-cat{flex:1;min-width:120px;max-width:160px}
.filter-bar{display:flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:13px}
.filter-bar[hidden]{display:none}
.filter-x{border:none;background:transparent;color:var(--primary);font-size:14px;cursor:pointer;line-height:1}
.icon-btn,.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:7px 14px;border-radius:10px;font-size:13px;transition:.15s;
}
.icon-btn:hover,.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary,#fff)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-ghost{background:transparent}
.btn-danger{color:var(--danger);border-color:var(--border);background:var(--surface)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
.btn-sm:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm.btn-danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.btn-sm.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}

main{margin-left:220px;padding:20px 24px}
.content{max-width:1400px;margin:0 auto}
.view{display:none}
.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=search],.toolbar input:not([type]),.toolbar>input{flex:1;min-width:160px}
input[type=text],input[type=search],input[type=date],input:not([type]),select,textarea{
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;outline:none;width:100%;
}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;line-height:1.7}
.empty{color:var(--text-2);text-align:center;padding:28px 10px;font-size:13px}
.spacer{flex:1}

/* ============ 通用组件 ============ */
.badge{font-size:12px;padding:2px 10px;border-radius:999px;white-space:nowrap}
.st-0{background:var(--gray-soft);color:var(--gray)}
.st-1{background:var(--amber-soft);color:var(--amber)}
.st-2{background:var(--green-soft);color:var(--green)}
.prog{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#60a5fa);border-radius:99px;transition:width .3s}
.prog-num{font-size:12px;color:var(--text-2)}
.sub{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px 8px;padding:3px 0;font-size:13px}
.sub-label{display:flex;gap:8px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
.sub-link{border:none;background:transparent;font-size:13px;padding:2px 4px;opacity:0;transition:opacity .15s;flex-shrink:0;line-height:1.4}
.sub:hover .sub-link{opacity:1}
.sub-tags{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;padding-left:24px;margin-top:2px}
.note-chip{border:1px solid var(--border);background:var(--gray-soft);color:var(--text-2);font-size:11px;border-radius:6px;padding:1px 8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.note-chip:hover{border-color:var(--primary);color:var(--primary)}
.sub-label input{margin-top:4px;width:auto;flex-shrink:0}
.sub .done{text-decoration:line-through;color:var(--text-2)}
.row-actions{display:flex;gap:8px;margin-top:8px}

/* ============ 日历 ============ */
.cal-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.cal-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-header h3{flex:1;text-align:center;font-size:16px}
.cal-header button{min-width:34px}
.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-weekdays span{text-align:center;font-size:12px;color:var(--text-2);padding:4px 0;font-weight:600}
.cal-cell{
  min-height:74px;border:1px solid var(--border);border-radius:10px;padding:6px;
  background:var(--surface-2);display:flex;flex-direction:column;gap:4px;transition:.12s;
}
.cal-cell:not(.blank){cursor:pointer}
.cal-cell:not(.blank):hover{border-color:var(--primary)}
.cal-cell.blank{background:transparent;border-color:transparent}
.cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal-cell.selected{background:var(--primary-soft);border-color:var(--primary)}
.cal-num{font-size:13px;font-weight:600}
.cal-cell.today .cal-num{color:var(--primary)}
.cal-badge{font-size:11px;color:var(--primary);font-weight:600;margin-top:auto}
.day-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.day-head h3{flex:1;font-size:15px}
.day-list{display:flex;flex-direction:column;gap:10px}
.plan-item{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-2)}
.plan-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.plan-title{font-weight:600;flex:1}

/* ============ 学习计划 ============ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
.stat .num{font-size:24px;font-weight:700;color:var(--primary)}
.stat .lbl{font-size:12px;color:var(--text-2)}
.plan-list{display:flex;flex-direction:column;gap:12px}
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer}
.plan-card:hover{border-color:var(--primary)}
.pc-head{display:flex;align-items:center;gap:10px}
.pc-title{font-weight:600;flex:1}
.pc-date{font-size:12px;color:var(--text-2)}
.chev{color:var(--text-2);transition:.2s}
.plan-card.open .chev{transform:rotate(180deg)}
.pc-desc{color:var(--text-2);font-size:13px;margin:6px 0;white-space:pre-wrap}
.pc-body{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px}

/* ============ 笔记 ============ */
.notes-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.notes-side{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 130px)}
#noteList{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.note-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface-2)}
.note-item:hover{border-color:var(--primary)}
.note-item.on{border-color:var(--primary);background:var(--primary-soft)}
.ni-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-meta{font-size:11px;color:var(--text-2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.mini-tag{background:var(--gray-soft);border-radius:6px;padding:0 6px}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);margin:0 6px 6px 0;cursor:pointer;color:var(--text-2)}
.tag.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.notes-main{min-height:calc(100vh - 160px);display:flex;flex-direction:column;gap:10px}
.ne-head{display:flex;gap:10px;flex-wrap:wrap}
.ne-title{font-size:17px;font-weight:700;flex:2;min-width:180px}
.ne-tags{flex:1;min-width:140px}
.ne-bar{display:flex;gap:8px;align-items:center}
.ne-body{flex:1;min-height:380px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.md-preview{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;overflow:auto}
.md-preview h1,.md-preview h2,.md-preview h3{margin:12px 0 6px}
.md-preview p{margin:6px 0}
.md-preview pre{background:var(--gray-soft);padding:10px;border-radius:8px;overflow:auto;margin:8px 0}
.md-preview code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.md-preview blockquote{border-left:3px solid var(--primary);padding-left:10px;color:var(--text-2);margin:8px 0}
.md-preview ul,.md-preview ol{padding-left:22px;margin:6px 0}
.md-preview table{border-collapse:collapse;margin:8px 0}
.md-preview th,.md-preview td{border:1px solid var(--border);padding:4px 10px}

/* ============ 链接 ============ */
.link-group{margin-bottom:18px}
.lg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lg-head h3{flex:1;font-size:15px}
.lg-acts{display:flex;gap:6px}
.link-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.link-card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);transition:.15s}
.link-card:hover{border-color:var(--primary);transform:translateY(-1px)}
.lc-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:var(--text)}
.fav{width:36px;height:36px;border-radius:9px;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary);font-weight:700}
.fav img{width:20px;height:20px;position:absolute;inset:0;margin:auto}
.lc-text{min-width:0}
.lc-name{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-note{font-size:12px;color:var(--text-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-acts{display:flex;gap:2px;opacity:.5;transition:.15s}
.link-card:hover .lc-acts{opacity:1}
.lc-acts button{border:none;background:transparent;font-size:14px;padding:2px 4px}

/* ============ 知识库 ============ */
.kb-layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.kb-side{max-height:calc(100vh - 130px);overflow-y:auto}
.kb-side-head{display:flex;align-items:center;margin-bottom:10px;font-weight:700}
.kb-side-head span{flex:1}
.kb-frow{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;font-size:13px}
.kb-frow:hover{background:var(--surface-2)}
.kb-fname{flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 4px;border-radius:6px}
.kb-fname.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.kb-facts{display:none;gap:2px}
.kb-frow:hover .kb-facts{display:flex}
.kb-facts button{border:none;background:transparent;font-size:12px;padding:2px 3px;color:var(--text-2)}
.kb-facts button:hover{color:var(--primary)}
.kb-main{min-height:calc(100vh - 160px)}
.kb-list{display:flex;flex-direction:column;gap:6px}
.kb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.kb-row:hover{border-color:var(--primary)}
.kb-rname{flex:1;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-ext{font-size:11px;background:var(--gray-soft);color:var(--text-2);border-radius:6px;padding:1px 8px}
.kb-time{font-size:12px;color:var(--text-2)}
.kb-acts{display:flex;gap:6px}
.kb-file-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.kf-name{font-weight:700;flex:1}
.kf-time{font-size:12px;color:var(--text-2)}
.kb-body{min-height:420px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.search-hit{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface-2);cursor:pointer}
.search-hit:hover{border-color:var(--primary)}
.search-hit .sh-path{font-size:11px;color:var(--text-2)}
.search-hit .sh-snip{font-size:12px;color:var(--text-2);margin-top:4px;white-space:pre-wrap;max-height:60px;overflow:hidden}
mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}

/* ============ 弹窗 / 提示 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{flex:1;font-size:16px}
.modal-x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--text-2)}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--border)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--text-2)}
.form .f-label{font-size:13px;color:var(--text-2)}
.f-sub-row{display:flex;gap:8px;margin-bottom:6px}
.confirm-msg{font-size:14px;line-height:1.8}

.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:9px 18px;box-shadow:var(--shadow);font-size:13px;opacity:0;transition:.25s}
.toast.show{opacity:1}
.toast.hide{opacity:0;transform:translateY(-8px)}

/* ============ 今日视图 ============ */

/* 计划类型子导航与分组 */
.plan-type-nav{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
.ptn-item{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}

.plan-link{opacity:1;font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
.plan-link:hover{background:var(--primary-soft);color:var(--primary)}
.plan-refs .sub-tags{flex-basis:100%;padding-left:0;margin-top:2px}
.res-group{margin-bottom:12px}
.res-group:last-child{margin-bottom:0}

.tv-title{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
'use strict';
/* ================= 基础工具 ================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
const todayStr = () => dstr(new Date());
function fmtDay(ts){ const d = new Date(ts); return dstr(d); }
function fmtTime(ts){ const d = new Date(ts); return fmtDay(ts) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function markHL(plain, q){
  const e = esc(plain);
  if(!q) return e;
  const eq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return e.replace(new RegExp('(' + eq + ')', 'gi'), '<mark>$1</mark>');
}
function download(name, text, mime){
  const blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function readText(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(file);
  });
}

/* ================= 存储层（统一前缀 + 异常处理） ================= */
const PREFIX = 'workbench_';
const Store = {
  get(k, def){
    try{
      const raw = localStorage.getItem(PREFIX + k);
      if(raw == null) return def;
      return JSON.parse(raw);
    }catch(e){ console.warn('读取失败:', k, e); return def; }
  },
  set(k, v){
    try{ localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; }
    catch(e){ toast('数据保存失败：浏览器存储空间可能已满', 'error'); return false; }
  }
};

/* ================= 全局状态 ================= */
let plans = Store.get('plans', []);
let notes = Store.get('notes', []);
let links = Store.get('links', []);
let kb    = Store.get('kb', { folders: [], files: [] });
if(!Array.isArray(kb.folders)) kb.folders = [];
if(!Array.isArray(kb.files))   kb.files   = [];
let marks = Store.get('calendar_marks', {});
let trash = Store.get('trash', []);            // 回收站：{id,kind,name,data,deletedAt}
if(!Array.isArray(trash)) trash = [];
let snapshots = Store.get('snapshots', []);    // 滚动自动快照（最多 3 份）
if(!Array.isArray(snapshots)) snapshots = [];
let activeCategory = null; // 分类筛选：null=全部
let planTypeFilter = null;  // 计划模块类型子导航：null=全部，否则为类型名
let planTypeFold = {};      // 计划模块“全部”视图下各类型分组的折叠状态（key=类型名）

let calY, calM, selDate;
let expanded = new Set();
let noteCur = null, noteSearch = '', noteTag = '', noteMode = 'edit';
let linkSearch = '';
let kbCur = null, kbSearch = '', kbFile = null;

/* ================= Toast / Modal ================= */
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.textContent = msg;
  $('#toastBox').appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 300); }, 2200);
}
function openModal(title, bodyEl, opts){
  opts = opts || {};
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = '<div class="modal">'
    + '<div class="modal-head"><h3>' + esc(title) + '</h3><button class="modal-x" data-act="modalClose">×</button></div>'
    + '<div class="modal-body"></div>'
    + '<div class="modal-foot"><button class="btn btn-ghost" data-act="modalClose">' + esc(opts.cancelText || '取消') + '</button>'
    + (opts.hideOk ? '' : '<button class="btn btn-primary modal-ok">' + esc(opts.okText || '确定') + '</button>') + '</div></div>';
  mask.querySelector('.modal-body').appendChild(bodyEl);
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', e => {
    if(e.target === mask || e.target.closest('[data-act="modalClose"]')) close();
  });
  const okBtn = mask.querySelector('.modal-ok');
  if(okBtn) okBtn.addEventListener('click', () => {
    const r = opts.onOk ? opts.onOk(bodyEl) : true;
    if(r !== false) close();
  });
  return { close, mask };
}
function confirmModal(msg, onOk){
  const p = document.createElement('p');
  p.className = 'confirm-msg';
  p.textContent = msg;
  openModal('请确认', p, { okText: '确定', onOk(){ onOk && onOk(); return true; } });
}
function promptModal(title, value, onOk){
  const el = document.createElement('div');
  el.innerHTML = '<input type="text" class="pm-input" value="' + esc(value || '') + '">';
  const input = el.querySelector('input');
  openModal(title, el, {
    onOk(){
      const v = input.value.trim();
      if(!v){ toast('内容不能为空', 'error'); return false; }
      onOk(v); return true;
    }
  });
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

/* ================= 主题（四季昼夜） ================= */
const SEASON_POEM = { spring:'春 · 杏花春雨', summer:'夏 · 荷塘月色', autumn:'秋 · 丹桂飘香', winter:'冬 · 踏雪寻梅' };
// 按节气日期与钟点判断季节/昼夜
function getSeasonAndTime(now){
  now = now || new Date();
  const md = (now.getMonth() + 1) * 100 + now.getDate();
  let season;
  if(md >= 204 && md <= 505) season = 'spring';        // 春 2/4~5/5
  else if(md >= 506 && md <= 807) season = 'summer';   // 夏 5/6~8/7
  else if(md >= 808 && md <= 1106) season = 'autumn';  // 秋 8/8~11/6
  else season = 'winter';                              // 冬 11/7~次年2/3
  const h = now.getHours();
  const timeOfDay = (h >= 6 && h < 18) ? 'day' : 'night';
  return { season, timeOfDay };
}
let themeMode = Store.get('theme_mode', 'auto'); // auto | day | night
function applyThemeMode(){
  const { season, timeOfDay } = getSeasonAndTime();
  const eff = themeMode === 'auto' ? timeOfDay : themeMode; // 手动模式强制昼夜
  const root = document.documentElement;
  root.dataset.season = season;
  root.dataset.time = eff;
  delete root.dataset.theme; // 清理旧版暗色标记
  const btn = $('#themeBtn');
  if(btn){
    btn.textContent = themeMode === 'auto' ? '🌗' : themeMode === 'day' ? '☀️' : '🌙';
    btn.title = '主题模式：' + (themeMode === 'auto' ? '自动（随季节昼夜）' : themeMode === 'day' ? '白天' : '黑夜') + '，点击循环切换';
  }
  const poem = $('#seasonPoem');
  if(poem) poem.textContent = SEASON_POEM[season] || '';
  Store.set('theme_mode', themeMode);
}
function cycleThemeMode(){
  themeMode = themeMode === 'auto' ? 'day' : themeMode === 'day' ? 'night' : 'auto';
  applyThemeMode();
}

/* ================= 分类（通用） ================= */
// plans/notes 空分类归一为“默认”；links 沿用其 category||“未分类”
function catOf(o){ const c = (o && o.category != null ? String(o.category).trim() : ''); return c || '默认'; }
function linkCat(l){ const c = (l && l.category != null ? String(l.category).trim() : ''); return c || '未分类'; }
// 计划预设类型（层级分类）；自定义类型由已用 category 自动汇总记忆
const PLAN_TYPES = [
  { name: '日程安排', icon: '🗓' },
  { name: '学习', icon: '📚' },
  { name: '旅行', icon: '✈️' },
  { name: '会议', icon: '📋' }
];
function isPlanType(name){ return PLAN_TYPES.some(t => t.name === name); }
function catIcon(c){
  c = c || '';
  if(c.indexOf('日程') >= 0) return '🗓';
  if(c.indexOf('学习') >= 0) return '📚';
  if(c.indexOf('工作') >= 0) return '💼';
  if(c.indexOf('旅行') >= 0 || c.indexOf('旅游') >= 0) return '✈️';
  if(c.indexOf('生活') >= 0) return '🏠';
  if(c.indexOf('会议') >= 0) return '📋';
  return '📌';
}
function catBadge(c){ return '<span class="cat-badge">' + catIcon(c) + ' ' + esc(c) + '</span>'; }
// 汇总 plans+notes+links 的分类，返回 [{name,count}]，按拼音排序
function allCategories(){
  const map = new Map();
  const bump = name => map.set(name, (map.get(name) || 0) + 1);
  plans.forEach(p => bump(catOf(p)));
  notes.forEach(n => bump(catOf(n)));
  links.forEach(l => bump(linkCat(l)));
  return Array.from(map.entries()).map(([name, count]) => ({ name, count }))
    .sort((a, b) => a.name.localeCompare(b.name, 'zh'));
}
function renderCategories(){
  const box = $('#catListBox'); if(!box) return;
  const cats = allCategories();
  box.innerHTML = cats.map(c =>
    '<button type="button" class="cat-item' + (activeCategory === c.name ? ' on' : '') + '" data-act="catFilter" data-cat="' + esc(c.name) + '">'
    + '<span class="cat-ico">' + catIcon(c.name) + '</span>'
    + '<span class="cat-name">' + esc(c.name) + '</span>'
    + '<span class="cat-count">' + c.count + '</span></button>').join('');
  const dl = $('#catList'); if(dl) dl.innerHTML = cats.map(c => '<option value="' + esc(c.name) + '">').join('');
}
function renderFilterBar(){
  const bar = $('#filterBar'); if(!bar) return;
  if(activeCategory){
    bar.hidden = false;
    bar.innerHTML = '正在筛选：<b>' + catIcon(activeCategory) + ' ' + esc(activeCategory) + '</b><button type="button" class="filter-x" data-act="filterClear" title="取消筛选">✕</button>';
  }else{
    bar.hidden = true; bar.innerHTML = '';
  }
}

/* ================= 学习计划逻辑 ================= */
function planProgress(p){
  const t = p.subtasks.length;
  if(!t) return 0;
  return Math.round(p.subtasks.filter(s => s.done).length / t * 100);
}
function planStatus(p){
  const t = p.subtasks.length;
  const d = p.subtasks.filter(s => s.done).length;
  if(t === 0 || d === 0) return '未开始';
  if(d === t) return '已完成';
  return '进行中';
}
function statusClass(st){ return st === '已完成' ? 'st-2' : st === '进行中' ? 'st-1' : 'st-0'; }
function rebuildMarks(){
  const m = {};
  plans.forEach(p => { if(p.date) m[p.date] = (m[p.date] || 0) + 1; });
  marks = m;
  Store.set('calendar_marks', marks);
}
function pruneRef(field, id){
  let changed = false;
  const clean = obj => {
    if(Array.isArray(obj[field]) && obj[field].indexOf(id) >= 0){
      obj[field] = obj[field].filter(x => x !== id); changed = true;
    }
  };
  plans.forEach(p => { clean(p); (p.subtasks || []).forEach(clean); }); // 计划级 + 子任务级
  return changed;
}
function pruneDanglingRefs(){
  let changed = false;
  // 回收站里的同类项也算“存在”：软删除期间保留子任务关联 id，还原后自动恢复
  const trashed = kind => trash.filter(t => t.kind === kind).map(t => t.data);
  const pools = {
    noteIds: notes.concat(trashed('note')),
    linkIds: links.concat(trashed('link')),
    docIds:  kb.files.concat(trashed('doc'))
  };
  plans.forEach(p => {
    [p].concat(p.subtasks || []).forEach(obj => {
      Object.keys(pools).forEach(field => {
        if(!Array.isArray(obj[field])) return;
        const pool = pools[field];
        const before = obj[field].length;
        obj[field] = obj[field].filter(x => pool.some(o => o.id === x));
        if(obj[field].length !== before) changed = true;
      });
    });
  });
  if(changed) Store.set('plans', plans);
  return changed;
}
function savePlans(){
  Store.set('plans', plans);
  rebuildMarks();
  renderPlans(); renderCalendar(); renderToday();
}

/* ================= 数据安全：自动快照 / 回收站 / URL 安全 ================= */
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
// URL 协议白名单：只放行 http/https，挡掉 javascript: 等危险协议（兜底旧数据/导入数据）
function safeUrl(u){
  try{
    const x = new URL(u);
    return (x.protocol === 'http:' || x.protocol === 'https:') ? u : '';
  }catch(e){ return ''; }
}
// 滚动快照：深拷贝当前五大块 + 回收站，最多保留 3 份；写入失败静默（快照是兜底，不打扰用户）
function snapshot(reason){
  try{
    const snap = {
      at: Date.now(), reason: reason || 'manual',
      data: {
        plans: deepCopy(plans), notes: deepCopy(notes), links: deepCopy(links),
        kb: deepCopy(kb), calendar_marks: deepCopy(marks), trash: deepCopy(trash)
      }
    };
    snapshots.unshift(snap);
    snapshots = snapshots.slice(0, 3);
    try{ localStorage.setItem(PREFIX + 'snapshots', JSON.stringify(snapshots)); }
    catch(e){ console.warn('自动快照保存失败（存储空间可能不足）'); }
  }catch(e){ console.warn('自动快照创建失败:', e); }
}
// 从快照恢复数据
function restoreSnapshot(snap){
  const d = (snap && snap.data) || {};
  if(Array.isArray(d.plans)){ plans = d.plans; Store.set('plans', plans); }
  if(Array.isArray(d.notes)){ notes = d.notes; Store.set('notes', notes); }
  if(Array.isArray(d.links)){ links = d.links; Store.set('links', links); }
  if(d.kb && Array.isArray(d.kb.folders)){ kb = d.kb; if(!Array.isArray(kb.files)) kb.files = []; Store.set('kb', kb); }
  if(d.calendar_marks && typeof d.calendar_marks === 'object'){ marks = d.calendar_marks; Store.set('calendar_marks', marks); }
  if(Array.isArray(d.trash)){ trash = d.trash; Store.set('trash', trash); }
  noteCur = null; kbFile = null;
  pruneDanglingRefs();
  rebuildMarks();
  updateTrashBtn();
}
function setMeta(k, v){
  const m = Store.get('meta', {}) || {};
  m[k] = v;
  Store.set('meta', m);
}
// 启动时：空数据自愈提示 + 每日快照 + 导出提醒
function startupBackupAndHeal(){
  const hasData = plans.length || notes.length || links.length || kb.files.length;
  const latest = snapshots[0];
  const snapCount = d => d ? (d.plans ? d.plans.length : 0) + (d.notes ? d.notes.length : 0) + (d.links ? d.links.length : 0) + (d.kb && d.kb.files ? d.kb.files.length : 0) : 0;
  const snapHasData = latest && snapCount(latest.data) > 0;
  if(!hasData && snapHasData){
    // 当前为空但有非空备份：询问是否恢复（不自动恢复，给新设备/主动清空留选择）
    confirmModal('检测到当前数据为空，找到 ' + fmtTime(latest.at) + ' 的自动备份（共 ' + snapCount(latest.data) + ' 条），是否恢复？', () => {
      restoreSnapshot(latest);
      renderAll();
      toast('已从自动备份恢复');
    });
    return; // 本次启动不新建快照
  }
  if(hasData && (!latest || (Date.now() - latest.at) > 24 * 3600 * 1000)) snapshot('daily');
  // 导出提醒：超过 7 天未导出文件备份则提示（快照防写坏，文件备份防清缓存/换设备）
  const meta = Store.get('meta', {}) || {};
  const last = meta.lastExportAt || 0;
  if(hasData && (!last || (Date.now() - last) > 7 * 24 * 3600 * 1000)){
    toast(last ? ('距上次文件备份已 ' + Math.floor((Date.now() - last) / (24 * 3600 * 1000)) + ' 天，建议点侧边栏「导出」备份')
               : '建议点侧边栏「导出」备份一份数据，防止清理缓存时丢失');
  }
}
/* ---- 回收站 ---- */
const TRASH_ICON = { plan:'🗂', note:'📝', link:'🔗', doc:'📄' };
const TRASH_NAME = { plan:'计划', note:'笔记', link:'链接', doc:'文档' };
function moveToTrash(kind, item, name){
  trash.unshift({ id: item.id, kind, name: name || '未命名', data: deepCopy(item), deletedAt: Date.now() });
  Store.set('trash', trash);
  updateTrashBtn();
}
// 彻底删除某类项时级联清理子任务关联 id（plan 不被子任务引用，无需清理）
function purgeRefForKind(kind, id){
  const field = kind === 'note' ? 'noteIds' : kind === 'link' ? 'linkIds' : kind === 'doc' ? 'docIds' : null;
  return field ? pruneRef(field, id) : false;
}
// 启动清理：删除超过 30 天的回收站项
function purgeExpiredTrash(){
  const limit = Date.now() - 30 * 24 * 3600 * 1000;
  const expired = trash.filter(t => t.deletedAt < limit);
  if(!expired.length) return;
  trash = trash.filter(t => t.deletedAt >= limit);
  let changed = false;
  expired.forEach(t => { if(purgeRefForKind(t.kind, t.id)) changed = true; });
  Store.set('trash', trash);
  if(changed) savePlans();
  updateTrashBtn();
}
function restoreTrash(id){
  const idx = trash.findIndex(t => t.id === id);
  if(idx < 0) return;
  const t = trash[idx];
  const exists = t.kind === 'plan' ? plans.some(x => x.id === t.id)
    : t.kind === 'note' ? notes.some(x => x.id === t.id)
    : t.kind === 'link' ? links.some(x => x.id === t.id)
    : kb.files.some(x => x.id === t.id);
  if(!exists){
    if(t.kind === 'plan') plans.unshift(t.data);
    else if(t.kind === 'note') notes.unshift(t.data);
    else if(t.kind === 'link') links.unshift(t.data);
    else kb.files.unshift(t.data);
  }
  trash.splice(idx, 1);
  Store.set('trash', trash);
  Store.set('plans', plans); Store.set('notes', notes); Store.set('links', links); Store.set('kb', kb);
  pruneDanglingRefs();
  rebuildMarks();
  renderAll();
  updateTrashBtn();
  toast('已还原');
}
function purgeTrashItem(id){
  const idx = trash.findIndex(t => t.id === id);
  if(idx < 0) return;
  const t = trash[idx];
  trash.splice(idx, 1);
  const changed = purgeRefForKind(t.kind, t.id);
  Store.set('trash', trash);
  if(changed) savePlans();
  updateTrashBtn();
}
function emptyTrash(){
  let changed = false;
  trash.forEach(t => { if(purgeRefForKind(t.kind, t.id)) changed = true; });
  trash = [];
  Store.set('trash', trash);
  if(changed) savePlans();
  updateTrashBtn();
}

  const btn = $('#trashBtn');

}

      + '<span style="color:var(--text-2);font-size:13px;">共 ' + trash.length + ' 项 · 删除后保留 30 天</span>'

      + '</div>'

// 计划类型下拉选项：预设四类 + 已用自定义类型 + “新建类型…”
function planTypeOptions(cur){
  const used = Array.from(new Set(plans.map(catOf))).filter(c => !isPlanType(c)).sort((a, b) => a.localeCompare(b, 'zh'));
  let opts = PLAN_TYPES.map(t => '<option value="' + esc(t.name) + '"' + (cur === t.name ? ' selected' : '') + '>' + t.icon + ' ' + esc(t.name) + '</option>').join('');
  used.forEach(c => { if(c !== cur) opts += '<option value="' + esc(c) + '"' + (cur === c ? ' selected' : '') + '>' + catIcon(c) + ' ' + esc(c) + '</option>'; });
  if(cur && !isPlanType(cur) && used.indexOf(cur) < 0) opts += '<option value="' + esc(cur) + '" selected>' + catIcon(cur) + ' ' + esc(cur) + '</option>';
  opts += '<option value="__new__">✏️ 新建类型…</option>';
  return opts;
}
// 新建计划前先选类型（引导式）；编辑已有计划不弹此窗
function openPlanTypePicker(onPick){
  const meta0 = Store.get('meta', {}) || {};
  const last = meta0.lastPlanType;
  const usedCustom = Array.from(new Set(plans.map(catOf))).filter(c => !isPlanType(c)).sort((a, b) => a.localeCompare(b, 'zh'));
  const el = document.createElement('div');
  const cell = (icon, name) =>
    '<button type="button" class="type-cell" data-act="typePick" data-type="' + esc(name) + '">' + icon + '<span>' + esc(name) + '</span>' + (last === name ? '<em>上次</em>' : '') + '</button>';
  el.innerHTML =
    '<div class="type-grid">'
    + PLAN_TYPES.map(t => cell(t.icon, t.name)).join('')
    + usedCustom.map(c => cell(catIcon(c), c)).join('')
    + '</div>'
    + '<div class="type-new"><input type="text" class="tn-input" placeholder="输入自定义类型名，如「健身」"><button type="button" class="btn-sm btn-primary" data-act="typeNew">新建并选择</button></div>';
  const modal = openModal('选择计划类型', el, { hideOk: true, cancelText: '取消' });
  const pick = name => {
    if(!name) return;
    setMeta('lastPlanType', name); // 记忆上次类型
    modal.close();
    onPick(name);
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    if(b.dataset.act === 'typePick') pick(b.dataset.type);
    else if(b.dataset.act === 'typeNew'){
      const v = el.querySelector('.tn-input').value.trim();
      if(!v){ toast('请输入类型名', 'error'); return; }
      pick(v);
    }
  });
  el.querySelector('.tn-input').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); const v = e.target.value.trim(); if(v) pick(v); }
  });

function openPlanModal(id, presetDate, presetType){
  const p = id ? plans.find(x => x.id === id) : null;
  const meta0 = Store.get('meta', {}) || {};
  const curType = p ? catOf(p) : (presetType || meta0.lastPlanType || PLAN_TYPES[0].name);

  // 类型下拉选“新建类型…”时弹输入框，输入后插入并选中
  el.querySelector('.f-cat').addEventListener('change', e => {
    if(e.target.value !== '__new__') return;
    promptModal('新类型名称', '', v => {
      const sel = el.querySelector('.f-cat');
      let opt = Array.from(sel.options).find(o => o.value === v);
      if(!opt){ opt = document.createElement('option'); opt.value = v; opt.textContent = catIcon(v) + ' ' + v; sel.insertBefore(opt, sel.querySelector('option[value="__new__"]')); }
      sel.value = v;
    });
  });
  const box = el.querySelector('.f-subs');
  function addRow(text, sid){
    const row = document.createElement('div');
    row.className = 'f-sub-row';
    row.innerHTML = '<input type="text" class="f-sub" placeholder="子任务内容" value="' + esc(text || '') + '">'
      + '<button type="button" class="btn-sm btn-danger" data-act="subRowDel">删除</button>';
    if(sid) row.querySelector('.f-sub').dataset.sid = sid;
    box.appendChild(row);
    row.querySelector('.f-sub').focus();
  }
  if(p) p.subtasks.forEach(s => addRow(s.text, s.id));
  else addRow('');
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if(!a) return;
    if(a.dataset.act === 'subAdd'){ e.preventDefault(); addRow(''); }
    if(a.dataset.act === 'subRowDel'){ a.closest('.f-sub-row').remove(); }
  });
  openModal(p ? '编辑计划' : '新增计划', el, {
    okText: '保存',
    onOk(){
      const title = el.querySelector('.f-title').value.trim();
      const date  = el.querySelector('.f-date').value;
      const desc  = el.querySelector('.f-desc').value.trim();
      let cat = el.querySelector('.f-cat').value;
      if(cat === '__new__' || !cat) cat = curType;
      if(!title){ toast('请填写标题', 'error'); return false; }
      if(!date){ toast('请选择关联日期', 'error'); return false; }
      const subs = Array.prototype.slice.call(el.querySelectorAll('.f-sub-row')).map(row => {
        const inp = row.querySelector('.f-sub');
        const old = inp.dataset.sid && p ? p.subtasks.find(s => s.id === inp.dataset.sid) : null;
        return { id: inp.dataset.sid || uid(), text: inp.value.trim(), done: old ? old.done : false, noteIds: old && Array.isArray(old.noteIds) ? old.noteIds : [], linkIds: old && Array.isArray(old.linkIds) ? old.linkIds : [], docIds: old && Array.isArray(old.docIds) ? old.docIds : [] };
      }).filter(s => s.text);
      if(p){
        p.title = title; p.desc = desc; p.date = date; p.subtasks = subs; p.category = cat;
      }else{
        plans.push({ id: uid(), title, desc, date, category: cat, subtasks: subs, createdAt: Date.now() });
      }
      setMeta('lastPlanType', cat);
      savePlans();
      toast(p ? '计划已更新' : '计划已添加');
      return true;
    }
  });
}

/* ================= 日历 ================= */
function initCal(){
  const t = new Date();
  calY = t.getFullYear(); calM = t.getMonth();
  selDate = todayStr();
}
function renderCalendar(){
  $('#calTitle').textContent = calY + '年' + (calM + 1) + '月';
  const grid = $('#calGrid');
  grid.innerHTML = '';
  const lead = (new Date(calY, calM, 1).getDay() + 6) % 7; // 周一为起始
  const days = new Date(calY, calM + 1, 0).getDate();
  for(let i = 0; i < lead; i++){
    const b = document.createElement('div');
    b.className = 'cal-cell blank';
    grid.appendChild(b);
  }
  for(let d = 1; d <= days; d++){
    const ds = calY + '-' + pad(calM+1) + '-' + pad(d);
    const c = document.createElement('div');
    c.className = 'cal-cell';
    if(ds === todayStr()) c.classList.add('today');
    if(ds === selDate) c.classList.add('selected');
    const n = activeCategory ? plans.filter(p => p.date === ds && catOf(p) === activeCategory).length : (marks[ds] || 0);
    c.innerHTML = '<span class="cal-num">' + d + '</span>' + (n ? '<span class="cal-badge">● ' + n + '</span>' : '');
    c.dataset.act = 'calPick';
    c.dataset.date = ds;
    grid.appendChild(c);
  }
  renderDayPanel();
}
function renderDayPanel(){
  const list = plans.filter(p => p.date === selDate && (!activeCategory || catOf(p) === activeCategory))
                    .sort((a, b) => a.title.localeCompare(b.title, 'zh'));
  let html = '<div class="day-head"><h3>📌 ' + esc(selDate) + '</h3>'
    + '<button class="btn btn-primary btn-sm" data-act="planAdd" data-date="' + selDate + '">＋ 添加计划</button></div>';
  html += list.length
    ? '<div class="day-list">' + list.map(p => planCardHTML(p, true)).join('') + '</div>'
    : '<p class="empty">当天暂无计划，点击「添加计划」开始安排。</p>';
  $('#dayPanel').innerHTML = html;
}

function renderMd(src){
  // marked 与 DOMPurify 任一缺失（CDN 失效/离线）都降级为转义纯文本，绝不返回未消毒 HTML
  if(window.marked && window.DOMPurify){
    try{ return DOMPurify.sanitize(marked.parse(src || '')); }
    catch(e){ /* 降级为纯文本 */ }
  }
  return '<pre>' + esc(src || '') + '</pre>';
}

function renderKB(){
  renderKbTree();

  }
  const q = kbSearch.trim();
  if(q){
    const ql = q.toLowerCase();

      x.name.toLowerCase().includes(ql) || (x.content || '').toLowerCase().includes(ql));
    let html = '<p style="color:var(--text-2);margin-bottom:10px">找到 ' + hits.length + ' 个匹配文件</p>';
    html += hits.length ? hits.map(h => {
      const inName = h.name.toLowerCase().includes(ql);
      let snip = '';
      if(!inName){
        const low = (h.content || '').toLowerCase();
        const i = low.indexOf(ql);
        if(i >= 0){
          const s = Math.max(0, i - 30), e = Math.min((h.content || '').length, i + q.length + 60);
          snip = (s > 0 ? '…' : '') + h.content.slice(s, e) + (e < h.content.length ? '…' : '');
        }
      }
      return '<div class="search-hit" data-act="kbOpenFile" data-id="' + h.id + '">'
        + '<div class="sh-path">📁 ' + esc(folderName(h.folderId)) + '</div>'
        + '<div><strong>' + markHL(h.name, q) + '</strong></div>'
        + (snip ? '<div class="sh-snip">' + markHL(snip, q) + '</div>' : '') + '</div>';
    }).join('') : '<p class="empty">没有匹配的文件。</p>';
    box.innerHTML = html;
    return;
  }
  const list = kb.files.filter(x => (x.folderId || null) === kbCur)
                      .sort((a, b) => b.updatedAt - a.updatedAt);
  box.innerHTML =
    '<div class="toolbar" style="margin-bottom:12px">'
    + '<strong style="flex:1">📂 ' + esc(folderName(kbCur)) + '（' + list.length + ' 个文件）</strong>'

    + '<div class="kb-list">' + (list.length ? list.map(fileRowHTML).join('') : '<p class="empty">该文件夹暂无文件。</p>') + '</div>';
}

  promptModal(f ? '重命名文件夹' : '新建文件夹', f ? f.name : '新文件夹', name => {
    if(f){ f.name = name; }
    else{ kb.folders.push({ id: uid(), name, parentId: parentId || null }); }
    saveKb();
  });
}
function deleteFolder(fid){
  const f = kb.folders.find(x => x.id === fid);
  if(!f) return;
  confirmModal('删除文件夹「' + f.name + '」？其中的文件将移动到根目录，不会被删除。', () => {
    const ids = new Set([fid]);
    let changed = true;
    while(changed){
      changed = false;
      kb.folders.forEach(x => {
        if(x.parentId && ids.has(x.parentId) && !ids.has(x.id)){ ids.add(x.id); changed = true; }
      });
    }
    kb.files.forEach(x => { if(ids.has(x.folderId)) x.folderId = null; });
    kb.folders = kb.folders.filter(x => !ids.has(x.id));
    if(ids.has(kbCur)) kbCur = null;
    saveKb();
    toast('文件夹已删除');
  });
}
function moveFileModal(fid){
  const f = kb.files.find(x => x.id === fid);
  if(!f) return;
  const el = document.createElement('div');
  el.innerHTML = '<select class="mv-sel"><option value="">🗄 根目录</option>'
    + kb.folders.map(x => '<option value="' + x.id + '"' + (f.folderId === x.id ? ' selected' : '') + '>📁 ' + esc(x.name) + '</option>').join('')
    + '</select>';
  openModal('移动到...', el, {
    onOk(){
      f.folderId = el.querySelector('.mv-sel').value || null;
      f.updatedAt = Date.now();
      saveKb();
      toast('已移动');
      return true;
    }
  });
}
function importKbFiles(fileList){
  const files = Array.prototype.slice.call(fileList);
  if(!files.length) return;
  const big = files.filter(f => f.size > 1024 * 1024);
  const go = async () => {
    for(const file of files){
      const content = await readText(file);
      kb.files.push({ id: uid(), name: file.name, folderId: kbCur, content, updatedAt: Date.now() });
    }
    Store.set('kb', kb);
    renderKB();
    toast('已导入 ' + files.length + ' 个文件');
  };
  if(big.length){
    confirmModal('有 ' + big.length + ' 个文件超过 1MB（' + big.map(f => f.name).join('、') + '），localStorage 容量有限，可能导致保存失败。仍要导入吗？', go);
  }else{ go(); }
}

function globalImport(file){
  readText(file).then(text => {
    let data;
    try{ data = JSON.parse(text); }
    catch(e){ toast('文件不是有效的 JSON', 'error'); return; }
    if(typeof data !== 'object' || !data){ toast('备份文件格式不正确', 'error'); return; }
    confirmModal('导入将覆盖当前所有模块的数据，确定继续？', () => {
      snapshot('before-import'); // 覆盖前先存一份滚动快照，导入出错可回退
      if(Array.isArray(data.plans)){ plans = data.plans; Store.set('plans', plans); }
      if(Array.isArray(data.notes)){ notes = data.notes; Store.set('notes', notes); }
      if(Array.isArray(data.links)){ links = data.links; Store.set('links', links); }
      if(data.kb && Array.isArray(data.kb.folders)){
        kb = data.kb;
        if(!Array.isArray(kb.files)) kb.files = [];
        Store.set('kb', kb);
      }
      if(data.calendar_marks && typeof data.calendar_marks === 'object'){
        marks = data.calendar_marks; Store.set('calendar_marks', marks);
      }
      if(Array.isArray(data.trash)){ trash = data.trash; if(!Array.isArray(trash)) trash = []; Store.set('trash', trash); }
      noteCur = null; kbFile = null;
      pruneDanglingRefs();
      rebuildMarks();
      updateTrashBtn();
      renderAll();
      toast('导入成功，数据已恢复');
    });
  }).catch(() => toast('文件读取失败', 'error'));
}

let todayFold = { plans:false, resources:false, notes:false };

function collectPlanRefs(p){
  const noteMap = new Map(), linkMap = new Map(), docMap = new Map();
  [p].concat(p.subtasks || []).forEach(s => {
    (Array.isArray(s.noteIds) ? s.noteIds : []).forEach(id => { const n = notes.find(x => x.id === id); if(n) noteMap.set(id, n); });
    (Array.isArray(s.linkIds) ? s.linkIds : []).forEach(id => { const l = links.find(x => x.id === id); if(l) linkMap.set(id, l); });
    (Array.isArray(s.docIds) ? s.docIds : []).forEach(id => { const d = kb.files.find(x => x.id === id); if(d) docMap.set(id, d); });
  });
  return { noteMap, linkMap, docMap };
}

function renderToday(){
  const sec = $('#view-today');
  if(!sec) return;
  const t = new Date();
  const week = '日一二三四五六'.charAt(t.getDay());
  const today = todayStr();
  const tPlans = plans.filter(p => p.date === today && (!activeCategory || catOf(p) === activeCategory))
                     .sort((a, b) => (a.title || '').localeCompare(b.title || '', 'zh'));
  const doneCount = tPlans.filter(p => planStatus(p) === '已完成').length;
  const avg = tPlans.length ? Math.round(tPlans.reduce((s, p) => s + planProgress(p), 0) / tPlans.length) : 0;
  const hero = '<div class="today-date">📅 今天是 ' + t.getFullYear() + '年' + (t.getMonth()+1) + '月' + t.getDate() + '日 星期' + week + '</div>'
    + '<div class="today-sub">今日 ' + tPlans.length + ' 个计划 · 已完成 ' + doneCount + ' 个' + (tPlans.length ? ' · 平均完成率 ' + avg + '%' : '') + '</div>';

  const agg = { noteMap:new Map(), linkMap:new Map(), docMap:new Map() };
  tPlans.forEach(p => {
    const r = collectPlanRefs(p);
    r.noteMap.forEach((v, k) => agg.noteMap.set(k, v));
    r.linkMap.forEach((v, k) => agg.linkMap.set(k, v));
    r.docMap.forEach((v, k) => agg.docMap.set(k, v));
  });
  const noteChips = Array.from(agg.noteMap.values()).map(n => '<button type="button" class="note-chip" data-act="todayView" data-kind="note" data-rid="' + n.id + '">📝 ' + esc(n.title || '无标题') + '</button>');
  const linkChips = Array.from(agg.linkMap.values()).map(l => '<a class="note-chip" href="' + esc(safeUrl(l.url) || '#') + '" target="_blank" rel="noopener noreferrer" data-act="linkOpen" title="' + esc(l.url) + '">🔗 ' + esc(l.name) + '</a>');
  const docChips  = Array.from(agg.docMap.values()).map(d => '<button type="button" class="note-chip" data-act="todayView" data-kind="doc" data-rid="' + d.id + '">📄 ' + esc(d.name) + '</button>');

  const foldHead = (icon, title, key, meta) =>
    '<div class="fold-head" data-act="todayFold" data-key="' + key + '">'
    + '<span class="fold-title">' + icon + ' ' + title + '</span>'
    + '<span class="fold-meta">' + (meta || '') + '</span>'
    + '<span class="fold-ico' + (todayFold[key] ? '' : ' open') + '">▾</span></div>';
  const foldBody = (key, inner) => '<div class="fold-body"' + (todayFold[key] ? ' hidden' : '') + '>' + inner + '</div>';
  const resGroup = (label, chips) =>
    '<div class="res-group"><div class="res-label">' + label + '（' + chips.length + '）</div>'
    + (chips.length ? '<div class="today-res">' + chips.join('') + '</div>' : '<p class="empty res-empty">暂无</p>') + '</div>';

  const plansInner = '<div style="margin-bottom:10px"><button type="button" class="btn btn-primary btn-sm" data-act="planAdd" data-date="' + today + '">＋ 添加今日计划</button></div>'
    + (tPlans.length ? '<div class="day-list">' + tPlans.map(planCardToday).join('') + '</div>'
      : '<p class="empty">今天没有学习计划，点击上方按钮添加。</p>');
  const resInner = resGroup('📝 笔记', noteChips) + resGroup('🔗 链接', linkChips) + resGroup('📚 知识库', docChips);
  const recent = notes.filter(x => !activeCategory || catOf(x) === activeCategory).slice().sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 6);
  const resTotal = noteChips.length + linkChips.length + docChips.length;
  const notesInner = recent.length
    ? '<div class="today-notes">' + recent.map(n =>
        '<div class="note-item" data-act="todayView" data-kind="note" data-rid="' + n.id + '">'
        + '<div class="ni-title">' + esc(n.title || '无标题') + '</div>'
        + '<div class="ni-meta">' + catBadge(catOf(n)) + fmtDay(n.updatedAt)
        + (n.tags || []).map(tg => '<span class="mini-tag">' + esc(tg) + '</span>').join('') + '</div></div>').join('') + '</div>'
    : '<p class="empty">还没有笔记。</p>';

  sec.innerHTML =
    '<div class="card today-hero">' + hero + '</div>'
    + '<div class="card">' + foldHead('🎯','今日计划','plans', tPlans.length ? tPlans.length + ' 个' : '') + foldBody('plans', plansInner) + '</div>'
    + '<div class="card">' + foldHead('📎','关联资料','resources', resTotal ? resTotal + ' 项' : '') + foldBody('resources', resInner) + '</div>'
    + '<div class="card">' + foldHead('📝','最近笔记','notes', recent.length ? recent.length + ' 篇' : '') + foldBody('notes', notesInner) + '</div>' + viewerCard();
  const pv = sec.querySelector('.tv-panel'); if(pv) pv.scrollIntoView({behavior:'smooth', block:'nearest'});
}

    case 'planDoc': openPlanPicker(b.dataset.plan, 'docIds'); break;
    case 'noteJump': jumpToNote(b.dataset.nid); break;
    case 'docJump': jumpToDoc(b.dataset.did); break;
    case 'linkOpen': break;
    case 'catFilter': activeCategory = (activeCategory === b.dataset.cat ? null : b.dataset.cat); renderAll(); break;
    case 'filterClear': activeCategory = null; renderAll(); break;
    case 'catManage': toast('分类管理功能开发中'); break;
    case 'todayFold': todayFold[b.dataset.key] = !todayFold[b.dataset.key]; renderToday(); break;
    case 'todayView': todayView = { kind: b.dataset.kind, id: b.dataset.rid }; renderToday(); break;
    case 'todayViewClose': todayView = null; renderToday(); break;
    case 'todayPlanExpand': if(todayCollapsed.has(id)) todayCollapsed.delete(id); else todayCollapsed.add(id); renderToday(); break;
    case 'todayEdit': {
      if(todayView){ const v = todayView; todayView = null;
        if(v.kind === 'note') jumpToNote(v.id); else jumpToDoc(v.id);
        renderToday(); }
      break;
    }
    case 'planExpand':
      if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
      renderPlans();
      break;
    case 'noteOpen':
      noteCur = id; noteMode = 'edit'; renderNotes(); break;
    case 'noteTag':
      noteTag = noteTag === b.dataset.tag ? '' : b.dataset.tag; renderNoteList(); break;
    case 'noteMode':
      if(noteMode !== b.dataset.mode){
        if($('#ntBody')) saveNoteFromEditor();
        noteMode = b.dataset.mode; renderNoteEditor();
      }
      break;
    case 'noteExportOne': {
      const n = notes.find(x => x.id === noteCur);
      if(n) download((n.title || 'note') + '.md', '# ' + n.title + '\n\n' + n.content, 'text/markdown;charset=utf-8');

    }
    case 'noteDel': {
      const n = notes.find(x => x.id === noteCur);

        const delId = noteCur;

        moveToTrash('note', n, n.title || '无标题笔记'); // 软删除：子任务关联 id 保留，还原后恢复
        renderNotes(); toast('已移入回收站，可在回收站还原');
      });
      break;

      });

    case 'catRename': {

        const key = old === '未分类' ? '' : old;

      });

    }
    case 'kbOpen':
      kbCur = b.dataset.fid || null; kbFile = null;
      kbSearch = ''; const si = $('#kbSearch'); if(si) si.value = '';
      renderKB();
      break;
    case 'kbFolderAdd': openFolderModal(b.dataset.fid); break;
    case 'kbFolderRen': openFolderModal(null, b.dataset.fid); break;
    case 'kbFolderDel': deleteFolder(b.dataset.fid); break;
    case 'kbFileNew':
      promptModal('新建文本文档', '未命名文档.txt', name => {
        kb.files.push({ id: uid(), name, folderId: kbCur, content: '', updatedAt: Date.now() });
        saveKb();
      });
      break;
    case 'kbOpenFile': kbFile = id; renderKB(); break;
    case 'kbFileBack': kbFile = null; renderKB(); break;
    case 'kbFileRen': {
      const f = kb.files.find(x => x.id === id);
      if(f) promptModal('重命名文件', f.name, name => { f.name = name; f.updatedAt = Date.now(); saveKb(); });
      break;
    }
    case 'kbFileMove': moveFileModal(id); break;
    case 'kbFileDel': {
      const f = kb.files.find(x => x.id === id);
      if(f) confirmModal('确定删除文件「' + f.name + '」？将移入回收站，可在回收站还原。', () => {
        kb.files = kb.files.filter(x => x.id !== id);
        if(kbFile === id) kbFile = null;
        moveToTrash('doc', f, f.name || '未命名文档');
        saveKb();
        toast('已移入回收站，可在回收站还原');
      });
      break;
    }
  }
});
// 全局勾选委托（子任务）
document.addEventListener('change', e => {
  const b = e.target.closest('[data-act="subToggle"]');
  if(!b) return;
  const p = plans.find(x => x.id === b.dataset.plan);
  const s = p && p.subtasks.find(x => x.id === b.dataset.sub);
  if(s){
    s.done = b.checked;
    savePlans();
  }
});

/* ================= 启动 ================= */
applyThemeMode();
setInterval(applyThemeMode, 10 * 60 * 1000); // 每 10 分钟重判（自动模式跟随昼夜，手动模式保持）
initCal();
purgeExpiredTrash();      // 清理回收站中超过 30 天的项
pruneDanglingRefs();
startupBackupAndHeal();   // 空数据自愈提示 + 每日快照 + 导出提醒
rebuildMarks();
updateTrashBtn();
renderAll();
</script>
